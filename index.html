<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NC旋盤プログラム描画ツール</title>
<style>
  :root {
    --bg: #f5f6f8;
    --panel: #ffffff;
    --border: #d0d4da;
    --text: #1a1d21;
    --muted: #6b7280;
    --canvas-bg: #fbfcfd;
    --grid: #e3e6ea;
    --axis: #9aa1ab;
    --center: #b06060;
    --hl: #fff3b0;
    --rapid: #9aa1ab;
    --accent: #e11d48;
    --time: #0f766e;
    --time-wait: #b45309;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14171b;
      --panel: #1c2026;
      --border: #333a44;
      --text: #e6e9ee;
      --muted: #9aa1ab;
      --canvas-bg: #0f1216;
      --grid: #222831;
      --axis: #566072;
      --center: #c07a7a;
      --hl: #4a4320;
      --rapid: #667085;
      --accent: #f43f5e;
      --time: #2dd4bf;
      --time-wait: #fbbf24;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", "Yu Gothic UI", sans-serif;
    background: var(--bg);
    color: var(--text);
    display: flex;
    flex-direction: column;
    height: 100vh;
    overflow: hidden;
  }
  header {
    padding: 8px 14px;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 14px;
    flex-wrap: wrap;
  }
  header h1 { font-size: 15px; margin: 0; font-weight: 600; }
  .controls { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; font-size: 13px; }
  .controls label { display: inline-flex; align-items: center; gap: 4px; cursor: pointer; }
  button {
    font: inherit; font-size: 13px; padding: 4px 10px;
    background: var(--panel); color: var(--text);
    border: 1px solid var(--border); border-radius: 5px; cursor: pointer;
  }
  button:hover { border-color: var(--muted); }
  .transport {
    display: flex; align-items: center; gap: 8px; padding: 6px 14px;
    background: var(--panel); border-bottom: 1px solid var(--border); font-size: 13px;
  }
  .transport button { min-width: 34px; padding: 4px 8px; }
  .transport .seek { flex: 1; min-width: 120px; cursor: pointer; }
  .transport .spd { display: inline-flex; align-items: center; gap: 5px; color: var(--muted); }
  .transport .spd input { width: 90px; }
  #playInfo { min-width: 130px; text-align: right; font-variant-numeric: tabular-nums; }
  .main { flex: 1; display: flex; min-height: 0; }
  .canvas-wrap { flex: 1; position: relative; min-width: 0; background: var(--canvas-bg); }
  canvas { display: block; width: 100%; height: 100%; cursor: crosshair; }
  #tooltip {
    position: absolute; pointer-events: none; z-index: 10;
    background: var(--panel); border: 1px solid var(--border); border-radius: 6px;
    padding: 6px 9px; font-size: 12px; line-height: 1.5; box-shadow: 0 4px 14px rgba(0,0,0,.18);
    display: none; white-space: nowrap; max-width: 320px;
  }
  #tooltip b { font-weight: 600; }
  .side {
    width: 340px; border-left: 1px solid var(--border); background: var(--panel);
    display: flex; flex-direction: column; min-height: 0;
  }
  .side-head { padding: 6px 10px; font-size: 12px; color: var(--muted); border-bottom: 1px solid var(--border); display:flex; justify-content:space-between; align-items:center; }
  .src { flex: 1; overflow: auto; font-family: "Consolas","Courier New",monospace; font-size: 12px; }
  .src .ln { display: flex; padding: 0 8px; white-space: pre; border-left: 3px solid transparent; cursor: pointer; }
  .src .ln:hover { background: var(--grid); }
  .src .ln.hl { background: var(--hl); }
  .src .ln.sel { border-left-color: var(--accent); }
  .src .num { color: var(--muted); width: 34px; text-align: right; margin-right: 10px; user-select: none; flex: none; }
  .legend { padding: 8px 10px; border-top: 1px solid var(--border); font-size: 12px; }
  .legend .row { display: flex; align-items: center; gap: 6px; margin: 3px 0; }
  .legend .orow { flex-wrap: wrap; }
  .legend .orow .oin { display: inline-flex; align-items: center; gap: 2px; color: var(--muted); font-size: 11px; }
  .legend .orow input { width: 54px; font: inherit; font-size: 11px; padding: 1px 3px;
    background: var(--canvas-bg); color: var(--text); border: 1px solid var(--border); border-radius: 4px; }
  .assist { padding: 8px 10px; border-top: 1px solid var(--border); font-size: 12px;
    max-height: 55vh; overflow-y: auto; }
  .assist.on { border-top: 2px solid var(--accent); }
  .assist .ahead { display: flex; align-items: center; gap: 6px; font-weight: 600; margin-bottom: 5px; }
  .assist .ahead .g { color: var(--accent); }
  .assist .arow { display: flex; align-items: center; gap: 5px; margin: 4px 0; }
  .assist .lab { color: var(--muted); width: 46px; flex: none; }
  .assist input[type=number] { width: 76px; font: inherit; font-size: 12px; padding: 1px 4px;
    background: var(--canvas-bg); color: var(--text); border: 1px solid var(--border); border-radius: 4px; }
  .assist input[readonly] { background: var(--grid); color: var(--muted); border-style: dashed; }
  .assist .auto { display: inline-flex; align-items: center; gap: 3px; color: var(--muted); font-size: 11px; cursor: pointer; }
  .assist .auto input { margin: 0; }
  .assist .fixed { color: var(--muted); font-size: 11px; }
  .assist .tag { color: var(--muted); font-size: 10px; border: 1px dashed var(--border); border-radius: 3px; padding: 0 3px; }
  .assist button.pin { font-size: 10px; padding: 1px 5px; }
  .assist .note { color: var(--muted); font-size: 11px; margin: 3px 0; line-height: 1.4; }
  .assist .err { color: var(--accent); font-size: 11px; margin: 3px 0; line-height: 1.4; }
  .assist .btns { display: flex; gap: 6px; margin-top: 7px; flex-wrap: wrap; }
  .assist button { font-size: 12px; padding: 3px 9px; }
  .assist button:disabled { opacity: .45; cursor: default; }
  .assist button.pri { border-color: var(--accent); color: var(--accent); }
  .assist button.pri:disabled { border-color: var(--border); color: var(--text); }
  .time { padding: 8px 10px; border-top: 1px solid var(--border); font-size: 12px;
    max-height: 42vh; overflow-y: auto; display: none; }
  .time.on { display: block; }
  .time .thead { display: flex; align-items: baseline; gap: 8px; margin-bottom: 6px; }
  .time .thead .tot { font-size: 22px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .time .thead .lab { color: var(--muted); font-size: 11px; }
  .time .trow { display: flex; align-items: center; gap: 6px; margin: 2px 0; }
  .time .trow .nm { flex: 1; display: inline-flex; align-items: center; gap: 5px; cursor: pointer; }
  .time .trow .sec { font-variant-numeric: tabular-nums; color: var(--muted); }
  .time .trow.sum { border-top: 1px solid var(--border); margin-top: 5px; padding-top: 5px; font-weight: 600; }
  .time .trow.sum .sec { color: var(--text); }
  .time .cnt { color: var(--muted); font-size: 10px; }
  .time .sub { color: var(--muted); font-size: 11px; margin: 6px 0 2px; }
  .time .tools { display: flex; flex-wrap: wrap; gap: 4px 10px; }
  .time .tools span { display: inline-flex; align-items: center; gap: 4px; font-variant-numeric: tabular-nums; }
  .time .tools i { width: 10px; height: 3px; border-radius: 2px; display: inline-block; }
  .time .warn { color: var(--time-wait); font-size: 11px; margin: 3px 0; line-height: 1.4; }
  .time .btns { display: flex; gap: 6px; margin-top: 7px; flex-wrap: wrap; align-items: center; }
  .time button { font-size: 11px; padding: 2px 7px; }
  .time code { background: var(--grid); border-radius: 3px; padding: 0 3px; }
  dialog#timeCfg {
    border: 1px solid var(--border); border-radius: 8px; background: var(--panel); color: var(--text);
    padding: 0; width: 520px; max-width: 92vw; max-height: 88vh; font-size: 12px;
  }
  dialog#timeCfg::backdrop { background: rgba(0,0,0,.45); }
  .cfg-head { display: flex; align-items: center; gap: 8px; padding: 10px 14px;
    border-bottom: 1px solid var(--border); font-weight: 600; font-size: 13px; }
  .cfg-head .sp { flex: 1; }
  .cfg-body { padding: 10px 14px; overflow-y: auto; max-height: 66vh; }
  .cfg-body h4 { margin: 12px 0 5px; font-size: 12px; color: var(--accent); font-weight: 600; }
  .cfg-body h4:first-child { margin-top: 0; }
  .cfg-row { display: flex; align-items: center; gap: 7px; margin: 4px 0; }
  .cfg-row .lab { flex: 1; }
  .cfg-row .unit { color: var(--muted); width: 52px; flex: none; }
  .cfg-row input[type=number], .cfg-row input[type=text] {
    width: 82px; font: inherit; font-size: 12px; padding: 2px 5px; text-align: right;
    background: var(--canvas-bg); color: var(--text); border: 1px solid var(--border); border-radius: 4px; }
  .cfg-row select { font: inherit; font-size: 12px; padding: 2px 4px;
    background: var(--canvas-bg); color: var(--text); border: 1px solid var(--border); border-radius: 4px; }
  .cfg-note { color: var(--muted); font-size: 11px; margin: 2px 0 6px; line-height: 1.4; }
  .cfg-foot { display: flex; gap: 6px; padding: 9px 14px; border-top: 1px solid var(--border); flex-wrap: wrap; }
  .cfg-foot .sp { flex: 1; }
  .mtab { display: flex; flex-wrap: wrap; gap: 5px; }
  .mtab .mrow { display: inline-flex; align-items: center; gap: 3px; border: 1px solid var(--border);
    border-radius: 4px; padding: 1px 3px 1px 6px; }
  .mtab .mrow input { width: 52px; }
  .mtab .mrow button { padding: 0 5px; line-height: 1.4; border: none; background: none; color: var(--muted); }
  .swatch { width: 22px; height: 3px; border-radius: 2px; flex: none; }
  .dash { background: repeating-linear-gradient(90deg, var(--rapid) 0 4px, transparent 4px 7px); height: 0; border-top: 2px dashed var(--rapid); }
  .hint { color: var(--muted); font-size: 11px; }
  .drop-hint {
    position:absolute; inset:0; display:none; align-items:center; justify-content:center;
    background: rgba(80,120,200,.12); border: 3px dashed #5b8def; color:#5b8def; font-size:18px; z-index:20;
  }
  .empty-hint {
    position:absolute; inset:0; display:flex; flex-direction:column; gap:8px;
    align-items:center; justify-content:center; text-align:center; color: var(--muted);
    font-size:16px; z-index:5; pointer-events:none;
  }
  .empty-hint .sub { font-size:12px; }
</style>
</head>
<body>
<header>
  <h1>NC旋盤 ツールパス描画</h1>
  <div class="controls">
    <button id="loadBtn">ファイルを開く</button>
    <input type="file" id="fileInput" accept=".nc,.txt,.tap,.cnc,.min,*" style="display:none">
    <button id="saveBtn">ファイルを保存</button>
    <button id="resetView">ビューリセット</button>
    <label><input type="checkbox" id="showRapid" checked> 早送り(G0)</label>
    <label><input type="checkbox" id="showLabels" checked> ラベル</label>
    <label><input type="checkbox" id="showDir"> 方向</label>
    <label><input type="checkbox" id="flipArc"> 円弧向き反転</label>
    <label><input type="checkbox" id="showTime"> 加工時間</label>
    <label><input type="checkbox" id="editMode"> 座標アシスト</label>
    <label><input type="checkbox" id="ixMode"> 交点測定</label>
    <button id="ixClear">交点クリア</button>
    <button id="timeCfgBtn" title="早送り速度・工具交換時間などの機械設定">&#9881; 時間設定</button>
    <span class="hint" id="ixHint">ホイール=ズーム / ドラッグ=移動</span>
  </div>
</header>
<div class="transport">
  <button id="btnRewind" title="先頭へ">⏮</button>
  <button id="btnStepBack" title="前のブロック">|◀</button>
  <button id="btnPlay" title="再生/一時停止">▶</button>
  <button id="btnStepFwd" title="次のブロック">▶|</button>
  <input type="range" id="seek" min="0" max="1000" value="1000" class="seek">
  <span class="hint" id="playInfo">全表示</span>
  <label class="spd">速度 <input type="range" id="speed" min="0.1" max="30" step="0.1" value="1"><span id="speedVal">&times;1.0</span></label>
</div>
<div class="main">
  <div class="canvas-wrap" id="canvasWrap">
    <canvas id="cv"></canvas>
    <div id="tooltip"></div>
    <div class="drop-hint" id="dropHint">NCファイルをドロップ</div>
    <div class="empty-hint" id="emptyHint">
      <div>NCプログラムを読み込んでください</div>
      <div class="sub">「ファイルを開く」ボタン、またはこの画面にドラッグ&ドロップ</div>
    </div>
  </div>
  <div class="side">
    <div class="side-head"><span id="fileName">（未読み込み）</span><span class="hint" id="segCount"></span></div>
    <div class="src" id="src"></div>
    <div class="assist" id="assist"></div>
    <div class="time" id="timePanel"></div>
    <div class="legend" id="legend"></div>
  </div>
</div>

<dialog id="timeCfg">
  <div class="cfg-head">
    <span>加工時間の設定</span>
    <select id="cfgPreset"></select>
    <button id="cfgNew" title="現在の設定を複製して新しい機械を作る">複製</button>
    <button id="cfgRename">名前</button>
    <button id="cfgDel">削除</button>
    <span class="sp"></span>
    <button id="cfgClose">閉じる</button>
  </div>
  <div class="cfg-body" id="cfgBody"></div>
  <div class="cfg-foot">
    <button id="cfgReset">この機械を既定値に戻す</button>
    <span class="sp"></span>
    <span class="hint" id="cfgSaved">localStorage に自動保存</span>
  </div>
</dialog>

<script>
"use strict";

// 工具ステーション → 色
const TOOL_COLORS = {
  0: "#8a8f98",
  1: "#3b82f6",
  2: "#f97316",
  3: "#22c55e",
  4: "#a855f7",
  5: "#ec4899",
  6: "#14b8a6",
  7: "#eab308",
  8: "#ef4444",
};
function toolColor(t) { return TOOL_COLORS[t] ?? "#8a8f98"; }

// ===== 加工時間の設定（機械プリセット） =====
// 早送り速度や工具交換時間は機械ごとに違うので、名前付きプリセットとして
// localStorage に持たせる。複数台を扱うときはプリセットを切り替える。
const CFG_KEY = "ncdrawer.machines";
const DEFAULT_CFG = {
  rapidX: 20, rapidZ: 24,              // 早送り [m/min]（X は「半径」移動量で評価する）
  spindleMax: 3000,                    // G50 S 指定が無いときの主軸最高回転 [rpm]
  defaultFeedMode: 99,                 // プログラムに G98/G99 が無いときの既定
  defaultCssMode: 97,                  // 同 G96/G97
  defaultRpm: 1500,                    // G97 で S が無いときの回転数 [rpm]
  defaultCss: 200,                     // G96 で S が無いときの周速 [m/min]
  defaultFeed: 0.2,                    // F が無いときの送り
  toolChangeSec: 2.0,                  // 工具交換（タレット割出し）1回あたり
  turretStations: 0, turretStepSec: 0, // >0 なら最短回りの段数×秒を上乗せ
  g28Sec: 1.5,                         // G28 原点復帰 1回あたり
  spindleAccelSec: 2.0,                // 0 ⇔ 最高回転 の加減速にかかる時間
  spindleThreshold: 500,               // これ未満の回転数変化は送りと重なるとみなし無視 [rpm]
  m0Sec: 0,                            // M0 プログラムストップ
  m1Enabled: false, m1Sec: 0,          // M1 オプショナルストップ（既定は素通り）
  mTable: {},                          // { "66": 1.5, ... } Mコード別の待ち時間 [秒]
  minBlockSec: 0,                      // 1ブロックの最小処理時間（先読み・サーボ応答の下限）
  factorCut: 1.0, factorRapid: 1.0,    // 実機に合わせ込む補正係数
};
// 時間の扱いを個別に決めているMコード（Mコード表の対象外）
const M_HANDLED = new Set([0, 1, 2, 3, 4, 5, 30, 98, 99]);

function newMachines() { return { active: 0, presets: [{ name: "既定", cfg: Object.assign({}, DEFAULT_CFG) }] }; }
function loadMachines() {
  try {
    const m = JSON.parse(localStorage.getItem(CFG_KEY) || "null");
    if (!m || !Array.isArray(m.presets) || !m.presets.length) return newMachines();
    // 保存後に増えた設定項目は既定値で補う
    for (const pr of m.presets) pr.cfg = Object.assign({}, DEFAULT_CFG, pr.cfg || {});
    m.active = Math.max(0, Math.min(m.presets.length - 1, m.active | 0));
    return m;
  } catch (e) { return newMachines(); }
}
function saveMachines() { try { localStorage.setItem(CFG_KEY, JSON.stringify(machines)); } catch (e) {} }
let machines = loadMachines();
function tcfg() { return machines.presets[machines.active].cfg; }
function flipOn() { return document.getElementById("flipArc").checked; }

// ===== パーサ =====
// 非切削G指令（これらを含む行は移動描画をスキップ、または位置設定のみ）
// origins: { toolStation: {x(直径), z} } 工具切替時にその原位置からアプローチを描く
function parseNc(text, origins, cfg, flip) {
  origins = origins || {};
  cfg = cfg || DEFAULT_CFG;
  const segs = [];
  const events = [];          // 移動を伴わないが時間のかかる行（ドウェル・工具交換・待ち）
  const toolsSeen = new Set();
  const mSeen = new Set();    // プログラムに現れた、Mコード表に未登録のMコード
  const warn = new Set();
  const rawLines = text.split(/\r?\n/);

  let motion = 0;      // モーダル 0/1/2/3
  let x = 0, z = 0;    // 現在絶対位置（x=直径）
  let tool = 0;
  let feed = 0;        // モーダル送り速度
  let posKnown = false;

  // --- 時間計算のためのモーダル状態 ---
  let sVal = 0;                       // S指令値（G97:rpm / G96:周速 m/min）
  let cssMode = cfg.defaultCssMode;   // 96=周速一定 / 97=回転数一定
  let sMax = null;                    // G50 S___ による主軸最高回転クランプ
  let feedMode = cfg.defaultFeedMode; // 98=mm/min / 99=mm/rev
  let feedModeSeen = false;
  let heldRpm = null;  // G96→G97 をS無しで切ったとき、直前の回転数を保持する
  let spindleOn = false;
  let curRpm = 0;      // 現在の実効回転数（主軸加減速の判定に使う）

  for (let i = 0; i < rawLines.length; i++) {
    const lineNo = i + 1;
    let line = rawLines[i];
    // 括弧内（コメント/代替値）を全削除
    line = line.replace(/\([^)]*\)/g, "");
    line = line.trim();
    if (!line || line === "%") continue;

    // トークン化: 英字 + 数値
    const words = [];
    const re = /([A-Za-z])\s*([+-]?[0-9]*\.?[0-9]+)/g;
    let m;
    while ((m = re.exec(line)) !== null) {
      words.push({ letter: m[1].toUpperCase(), value: parseFloat(m[2]) });
    }
    if (!words.length) continue;

    // Gコード / Mコードを収集
    const gcodes = words.filter(w => w.letter === "G").map(w => w.value);
    const mcodes = words.filter(w => w.letter === "M").map(w => Math.abs(Math.round(w.value)));
    const isDwell = gcodes.includes(4);
    const isG28 = gcodes.includes(28);
    const isG50 = gcodes.includes(50);
    if (gcodes.includes(20)) warn.add("G20（インチ指令）は未対応です。時間はミリ指令として計算しています。");
    const cssBefore = cssMode;
    const rpmBefore = curRpm;
    // モーダル motion を更新（G0-G3 のみ）／周速モード・送りモードも拾う
    for (const g of gcodes) {
      if (g === 0 || g === 1 || g === 2 || g === 3) motion = g;
      else if (g === 96 || g === 97) cssMode = g;
      else if (g === 98 || g === 99) { feedMode = g; feedModeSeen = true; }
    }

    // 送り速度更新
    for (const w of words) if (w.letter === "F") feed = w.value;

    // S語: G50 と同じ行なら主軸最高回転のクランプ、それ以外は主軸指令
    const hasSpindleS = !isG50 && words.some(w => w.letter === "S");
    let spindleCmd = cssMode !== cssBefore;
    for (const w of words) {
      if (w.letter !== "S") continue;
      if (isG50) sMax = w.value;
      else { sVal = w.value; heldRpm = null; spindleCmd = true; }
    }
    // G96→G97 をS無しで切り替えた場合、実機は直前の回転数を保持する
    if (cssMode === 97 && cssBefore === 96 && !hasSpindleS) heldRpm = rpmBefore || null;
    for (const mc of mcodes) {
      if (mc === 3 || mc === 4) { spindleOn = true; spindleCmd = true; }
      else if (mc === 5) { spindleOn = false; spindleCmd = true; }
    }

    // 工具更新（ステーションが変化したら原位置へリセット＋工具交換イベント）
    for (const w of words) {
      if (w.letter !== "T") continue;
      const v = Math.abs(Math.round(w.value));
      const st = v >= 100 ? Math.floor(v / 100) : v;
      if (st === tool) continue;
      const prev = tool;
      tool = st;
      // T00 は工具キャンセルであって割出しではないので時間に数えない
      if (st >= 1) events.push({ line: lineNo, kind: "toolchange", tool: st,
        sec: toolChangeSec(prev, st, cfg), label: (prev ? "T" + prev : "－") + "→T" + st });
      const o = origins[tool];
      if (o && isFinite(o.x) && isFinite(o.z)) {
        // 原位置から次の移動をアプローチとして描くため位置を確定
        x = o.x; z = o.z; posKnown = true;
      }
    }

    // 主軸加減速：指令のあった行だけ、その時点の径での回転数差から見積もる。
    // （G96で切削中に径が変わって回転数が動く分は送りと重なるので数えない）
    curRpm = spindleOn ? rpmAt(x, { sVal, cssMode, sMax, heldRpm }, cfg) : 0;
    if (spindleCmd && cfg.spindleAccelSec > 0 && cfg.spindleMax > 0) {
      const dr = Math.abs(curRpm - rpmBefore);
      if (dr >= cfg.spindleThreshold) {
        events.push({ line: lineNo, kind: "spindle", tool,
          sec: dr / (cfg.spindleMax / cfg.spindleAccelSec),
          label: "主軸 " + Math.round(rpmBefore) + "→" + Math.round(curRpm) + "rpm" });
      }
    }

    // M停止 / Mコード別の待ち時間
    for (const mc of mcodes) {
      if (mc === 0) { events.push({ line: lineNo, kind: "mstop", tool, sec: cfg.m0Sec, label: "M0 プログラムストップ" }); continue; }
      if (mc === 1) { if (cfg.m1Enabled) events.push({ line: lineNo, kind: "mstop", tool, sec: cfg.m1Sec, label: "M1 オプショナルストップ" }); continue; }
      if (M_HANDLED.has(mc)) continue;
      mSeen.add(mc);
      const sec = +cfg.mTable[mc] || 0;
      if (sec > 0) events.push({ line: lineNo, kind: "mcode", tool, sec, label: "M" + mc });
    }

    // 座標語を収集（motionで使う候補）
    let hasMove = false;
    let nx = x, nz = z;
    let rArc = null;
    for (const w of words) {
      switch (w.letter) {
        case "X": nx = w.value; hasMove = true; break;             // 絶対直径
        case "Z": nz = w.value; hasMove = true; break;             // 絶対
        case "U": nx = x + w.value; hasMove = true; break;         // 増分直径
        case "W": nz = z + w.value; hasMove = true; break;         // 増分
        case "R": rArc = w.value; break;
      }
    }

    // ドウェル(G4)：X/U/W は秒、P は 1/1000秒。移動としては扱わない
    if (isDwell) {
      let sec = 0;
      for (const w of words) {
        if (w.letter === "X" || w.letter === "U" || w.letter === "W") sec = Math.abs(w.value);
        else if (w.letter === "P") sec = Math.abs(w.value) / 1000;
      }
      events.push({ line: lineNo, kind: "dwell", tool, sec, label: "G4 ドウェル" });
      continue;
    }
    // 原点復帰(G28)：機械原点の座標は不明なので固定時間で見積もる
    if (isG28) {
      if (cfg.g28Sec > 0) events.push({ line: lineNo, kind: "g28", tool, sec: cfg.g28Sec, label: "G28 原点復帰" });
      posKnown = false; continue;
    }

    if (!hasMove) continue;

    // G50: 座標設定 → 位置確定のみ、線は引かない
    if (isG50) { x = nx; z = nz; posKnown = true; continue; }

    if (!posKnown) {
      // 最初の位置確定（線を引かない）
      x = nx; z = nz; posKnown = true;
      continue;
    }

    // セグメント追加
    const seg = {
      type: motion, tool, feed,
      x0: x, z0: z, x1: nx, z1: nz,
      r: (motion === 2 || motion === 3) ? rArc : null,
      line: lineNo,
      sVal, cssMode, sMax, feedMode, heldRpm,   // 時間計算用のモーダル状態を凍結
    };
    segs.push(seg);
    toolsSeen.add(tool);
    x = nx; z = nz;
  }

  if (!feedModeSeen) warn.add("G98/G99 の指定がありません。既定（G" + cfg.defaultFeedMode + "）で計算しています。");
  if (segs.some(sg => sg.type !== 0 && !(sg.feed > 0))) warn.add("送り(F)の無い切削ブロックがあります。既定 F" + cfg.defaultFeed + " で計算しています。");

  const d = {
    segs, events, tools: [...toolsSeen].sort((a, b) => a - b), rawLines,
    mSeen: [...mSeen].sort((a, b) => a - b), warn: [...warn],
  };
  computeTimes(d, cfg, flip);
  return d;
}

// 工具交換（タレット割出し）1回の時間。段数比例を設定していればその分を上乗せする
function toolChangeSec(from, to, cfg) {
  let sec = cfg.toolChangeSec;
  const n = cfg.turretStations | 0;
  if (n > 1 && cfg.turretStepSec > 0 && from >= 1 && to >= 1) {
    const diff = Math.abs(to - from) % n;
    sec += Math.min(diff, n - diff) * cfg.turretStepSec;   // 最短回り
  }
  return Math.max(0, sec);
}

// 円弧の向き。省略時は画面のトグルに従う（時間計算からは明示的に渡す）
function arcFlip(flip) { return flip === undefined ? flipOn() : !!flip; }

// セグメントの幾何長（(z, r)平面、r=x/2）＝工具が実際に動く距離
function segLength(s, flip) {
  if (s.type === 2 || s.type === 3) {
    const ap = arcParams(s, arcFlip(flip));
    if (ap) {
      let sweep = ap.a1 - ap.a0;
      if (ap.cw) { while (sweep > 0) sweep -= 2 * Math.PI; } else { while (sweep < 0) sweep += 2 * Math.PI; }
      return Math.abs(sweep) * ap.R;
    }
  }
  return Math.hypot(s.z1 - s.z0, (s.x1 - s.x0) / 2);
}

// ===== 加工時間の計算 =====
// 旋盤なので「送り＝F×主軸回転数」であり、G96(周速一定)では回転数が径で変わる。
// したがって径の変わる線は径に沿って積分しないと正しい時間にならない。

// 直径 d [mm] における実効回転数 [rpm]。md は {sVal, cssMode, sMax, heldRpm}
function rpmAt(d, md, cfg) {
  const smax = (md.sMax > 0) ? md.sMax : cfg.spindleMax;
  if (md.cssMode !== 96) {
    // G97: S をそのまま回転数として使う（G96から S 無しで抜けた場合は保持値）
    const r = md.heldRpm > 0 ? md.heldRpm : (md.sVal > 0 ? md.sVal : cfg.defaultRpm);
    return Math.min(r, smax);
  }
  // G96: rpm = 1000·S / (π·D)。D→0 で発散するので必ず最高回転でクランプする
  const s = md.sVal > 0 ? md.sVal : cfg.defaultCss;
  const dd = Math.abs(d);
  return dd > 1e-6 ? Math.min(1000 * s / (Math.PI * dd), smax) : smax;
}

// G96+毎回転送りの直線。径 D は弧長に対し線形なので解析的に解ける。
//   t[min] = K·∫D ds   （クランプが効かない範囲）
//   t[min] = CL·ΔL     （回転数が最高回転に張り付いた範囲）
// クランプ径 Dc をまたぐ線は 2 区間に割る。
function cssLineMinutes(d0, d1, len, dc, K, CL) {
  d0 = Math.abs(d0); d1 = Math.abs(d1);
  if (len <= 0) return 0;
  if (Math.min(d0, d1) >= dc) return K * len * (d0 + d1) / 2;   // 全域クランプなし
  if (Math.max(d0, d1) <= dc) return CL * len;                  // 全域クランプ
  const f = (dc - d0) / (d1 - d0);                              // Dc に達する位置 0..1
  const l1 = len * f, l2 = len - l1;
  return (d0 < dc ? CL * l1 : K * l1 * (d0 + dc) / 2)
       + (d0 < dc ? K * l2 * (dc + d1) / 2 : CL * l2);
}

// 切削1ブロックの所要秒数（補正係数は掛けない）
function cutSeconds(seg, len, cfg, flip) {
  const F = seg.feed > 0 ? seg.feed : cfg.defaultFeed;
  if (!(F > 0) || len <= 0) return 0;
  if (seg.feedMode === 98) return len / F * 60;                 // G98: F は mm/min
  const smax = (seg.sMax > 0) ? seg.sMax : cfg.spindleMax;
  if (seg.cssMode !== 96) return len / (F * rpmAt(0, seg, cfg)) * 60;   // G97: 回転数一定
  const S = seg.sVal > 0 ? seg.sVal : cfg.defaultCss;
  const dc = 1000 * S / (Math.PI * smax);   // これ未満の径では最高回転に張り付く
  const K = Math.PI / (1000 * F * S);
  const CL = 1 / (F * smax);
  if (seg.type !== 2 && seg.type !== 3) return cssLineMinutes(seg.x0, seg.x1, len, dc, K, CL) * 60;
  // 円弧は径が弧長に対し非線形なので分割して台形和
  const N = 64;
  let minutes = 0, prev = segPointAt(seg, 0, flip);
  for (let k = 1; k <= N; k++) {
    const cur = segPointAt(seg, k / N, flip);
    const dl = Math.hypot(cur.z - prev.z, cur.r - prev.r);
    const dm = prev.r + cur.r;              // 区間の平均直径（r=D/2 なので r0+r1）
    minutes += dm >= dc ? K * dl * dm : CL * dl;
    prev = cur;
  }
  return minutes * 60;
}

// 早送りは各軸が独立に最高速で動くので、遅い方の軸で時間が決まる
function rapidSeconds(seg, cfg) {
  const dr = Math.abs(seg.x1 - seg.x0) / 2;   // X軸の実移動は「半径」量
  const dz = Math.abs(seg.z1 - seg.z0);
  const vx = cfg.rapidX > 0 ? cfg.rapidX : DEFAULT_CFG.rapidX;
  const vz = cfg.rapidZ > 0 ? cfg.rapidZ : DEFAULT_CFG.rapidZ;
  // 速度は m/min、距離は mm → 秒 = mm / (m/min × 1000) × 60
  return Math.max(dr / vx, dz / vz) * 0.06;
}

// セグメント・イベントに秒数を入れ、実行順のタイムライン steps を組む
function computeTimes(d, cfg, flip) {
  for (const s of d.segs) {
    s.len = segLength(s, flip);
    s.est = s.type !== 0 && !(s.feed > 0);
    if (s.type === 0) {
      s.sec = rapidSeconds(s, cfg) * cfg.factorRapid;
      s.rpm0 = s.rpm1 = null; s.feedMMPM = null;
      s.cat = "rapid";
    } else {
      s.sec = cutSeconds(s, s.len, cfg, flip) * cfg.factorCut;
      s.rpm0 = rpmAt(s.x0, s, cfg);
      s.rpm1 = rpmAt(s.x1, s, cfg);
      const F = s.feed > 0 ? s.feed : cfg.defaultFeed;
      s.feedMMPM = s.feedMode === 98 ? F : F * (s.rpm0 + s.rpm1) / 2;
      s.cat = (s.type === 2 || s.type === 3) ? "arc" : "cut";
    }
    if (cfg.minBlockSec > 0) s.sec = Math.max(s.sec, cfg.minBlockSec);
  }
  for (const e of d.events) {
    e.cat = e.kind === "dwell" ? "dwell" : (e.kind === "toolchange" ? "tool" : "aux");
  }

  // 実行順にマージ。同じ行ならイベントが先（工具割出しや主軸待ちは移動の前に起きる）
  const steps = [];
  let ei = 0;
  for (const seg of d.segs) {
    while (ei < d.events.length && d.events[ei].line <= seg.line) steps.push({ kind: "wait", evt: d.events[ei++] });
    steps.push({ kind: "move", seg });
  }
  while (ei < d.events.length) steps.push({ kind: "wait", evt: d.events[ei++] });
  d.steps = steps;

  // 再生用の時間軸。長さ0のブロックで割り算が壊れないよう最小値を入れる
  const cumT = [0];
  let t = 0;
  d.doneBefore = new Array(steps.length);   // step i より前に完了しているセグメント数
  d.segStepIdx = new Array(d.segs.length);  // セグメント k に対応する step 番号
  let mc = 0;
  for (let i = 0; i < steps.length; i++) {
    d.doneBefore[i] = mc;
    if (steps[i].kind === "move") d.segStepIdx[mc++] = i;
    t += Math.max(steps[i].kind === "move" ? steps[i].seg.sec : steps[i].evt.sec, 1e-4);
    cumT.push(t);
  }
  d.cumT = cumT;
  d.totalT = t || 1;

  // 集計（種別トグルは合計の出し方だけを変える。再生は常に全体の実時間で動く）
  d.sum = { cut: 0, arc: 0, rapid: 0, dwell: 0, tool: 0, aux: 0 };
  d.cnt = { cut: 0, arc: 0, rapid: 0, dwell: 0, tool: 0, aux: 0 };
  for (const sg of d.segs) { d.sum[sg.cat] += sg.sec; d.cnt[sg.cat]++; }
  for (const e of d.events) { d.sum[e.cat] += e.sec; d.cnt[e.cat]++; }
}

// 秒 → "2:41" / "0:03.4"（1分未満は小数1桁まで出す）
function fmtSec(v) {
  if (!isFinite(v) || v < 0) v = 0;
  const mm = Math.floor(v / 60), ss = v - mm * 60;
  if (mm === 0) return ss.toFixed(ss < 10 ? 2 : 1) + "s";
  return mm + ":" + (ss < 10 ? "0" : "") + ss.toFixed(1);
}

// ===== 状態 =====
let origins = {}; // { toolStation: {x(直径), z} }
let state = {
  data: null,
  fileName: "（未読み込み）",
  // ビュー変換（ワールド=(z, r) → スクリーン）
  scale: 1, offsetX: 0, offsetY: 0,
  fitDone: false,
  hoverSeg: null,
  // 再生
  playing: false,
  playhead: 1,   // 0..1（全体進捗）。1=全表示
  speed: 1,      // 再生速度倍率
  // 交点測定
  ixFirst: null,      // 選択中の1本目セグメント
  ixPoints: [],       // {aLine, bLine} 理論交点を作る2線の行番号。座標は都度解く
  // 座標アシスト
  editLine: null,     // 選択中セグメントの行番号（reparseを跨いで生き残る識別子）
  edit: null,         // { x1, z1, ang, r, auto:"x1"|"z1"|"ang", err }
  // 加工時間
  timeCats: { cut: true, arc: true, rapid: true, dwell: true, tool: true, aux: true },
  timeHidden: new Set(),  // ラベルを個別に消した行番号（reparseを跨いで残す）
  labelMode: false,       // クリックでラベルを個別トグルするモード
};

// 座標アシストの編集履歴（プログラムは小さいので全文スナップショットで十分）
let undoStack = [];
let savedText = "";  // 最後に読み込み/保存した時点のテキスト
let dirty = false;   // 未保存の編集あり
let eol = "\n";      // 元ファイルの改行コード

const cv = document.getElementById("cv");
const ctx = cv.getContext("2d");
const tooltip = document.getElementById("tooltip");
const wrap = document.getElementById("canvasWrap");

// world → screen
function wx(z) { return z * state.scale + state.offsetX; }
function wy(r) { return -r * state.scale + state.offsetY; } // 画面はy下向き、rは上向き
// screen → world
function sxToZ(px) { return (px - state.offsetX) / state.scale; }
function syToR(py) { return -(py - state.offsetY) / state.scale; }

function resizeCanvas() {
  const dpr = window.devicePixelRatio || 1;
  const w = wrap.clientWidth, h = wrap.clientHeight;
  cv.width = Math.round(w * dpr);
  cv.height = Math.round(h * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  draw();
}

function bounds() {
  const d = state.data;
  let minZ = Infinity, maxZ = -Infinity, maxR = 0;
  for (const s of d.segs) {
    const r0 = Math.abs(s.x0) / 2, r1 = Math.abs(s.x1) / 2;
    minZ = Math.min(minZ, s.z0, s.z1);
    maxZ = Math.max(maxZ, s.z0, s.z1);
    maxR = Math.max(maxR, r0, r1);
  }
  if (!isFinite(minZ)) { minZ = -10; maxZ = 10; maxR = 10; }
  return { minZ, maxZ, maxR };
}

function fitView() {
  const b = bounds();
  const w = wrap.clientWidth, h = wrap.clientHeight;
  const pad = 40;
  const spanZ = Math.max(b.maxZ - b.minZ, 1);
  const spanR = Math.max(b.maxR * 2, 1); // 上下対称なので 2*maxR
  const sx = (w - pad * 2) / spanZ;
  const sy = (h - pad * 2) / spanR;
  state.scale = Math.min(sx, sy);
  const cz = (b.minZ + b.maxZ) / 2;
  state.offsetX = w / 2 - cz * state.scale;
  state.offsetY = h / 2; // r=0 が縦中央
  state.fitDone = true;
}

// 円弧の中心を計算（(z,r)平面）。G2=CW, G3=CCW（画面座標系ではなく数学座標=r上向き）
function arcParams(s, flip) {
  const z0 = s.z0, r0 = s.x0 / 2, z1 = s.z1, r1 = s.x1 / 2;
  const R = Math.abs(s.r);
  const dz = z1 - z0, dr = r1 - r0;
  const d = Math.hypot(dz, dr);
  if (d < 1e-9 || R < d / 2) return null;
  const mx = (z0 + z1) / 2, my = (r0 + r1) / 2;
  const h = Math.sqrt(Math.max(R * R - (d / 2) * (d / 2), 0));
  // 弦に垂直な単位ベクトル
  const ux = -dr / d, uy = dz / d;
  let cw = (s.type === 2); // G2=CW
  if (flip) cw = !cw;
  // 2つの中心候補。向きと劣弧(R>0)で選択する。
  // 候補A: 中点 + h*u, 候補B: 中点 - h*u
  const cands = [
    { cz: mx + ux * h, cr: my + uy * h },
    { cz: mx - ux * h, cr: my - uy * h },
  ];
  // r=R>0 は劣弧。中心を選んで、start→endが指定回転方向かつ劣弧になるものを採用
  for (const c of cands) {
    const a0 = Math.atan2(r0 - c.cr, z0 - c.cz);
    const a1 = Math.atan2(r1 - c.cr, z1 - c.cz);
    let sweep = a1 - a0;
    // CW(数学座標で時計回り=角度減少)
    if (cw) { while (sweep > 0) sweep -= 2 * Math.PI; }
    else    { while (sweep < 0) sweep += 2 * Math.PI; }
    if (Math.abs(sweep) <= Math.PI + 1e-6) {
      return { cz: c.cz, cr: c.cr, R, a0, a1, cw };
    }
  }
  // フォールバック（劣弧が見つからなければ最初の候補）
  const c = cands[0];
  const a0 = Math.atan2(r0 - c.cr, z0 - c.cz);
  const a1 = Math.atan2(r1 - c.cr, z1 - c.cz);
  return { cz: c.cz, cr: c.cr, R, a0, a1, cw };
}

function draw() {
  const d = state.data;
  const w = wrap.clientWidth, h = wrap.clientHeight;
  const css = getComputedStyle(document.documentElement);
  const colGrid = css.getPropertyValue("--grid").trim();
  const colAxis = css.getPropertyValue("--axis").trim();
  const colCenter = css.getPropertyValue("--center").trim();
  const colRapid = css.getPropertyValue("--rapid").trim();
  const colMuted = css.getPropertyValue("--muted").trim();
  const colWait = css.getPropertyValue("--time-wait").trim();

  ctx.clearRect(0, 0, w, h);
  if (!d) return;

  const showRapid = document.getElementById("showRapid").checked;
  const showLabels = document.getElementById("showLabels").checked;
  const flip = document.getElementById("flipArc").checked;
  const showDir = document.getElementById("showDir").checked;

  // --- グリッド + 目盛 ---
  drawGrid(w, h, colGrid, colAxis, colMuted, showLabels);

  // --- 中心線 (r=0) ---
  ctx.save();
  ctx.strokeStyle = colCenter;
  ctx.setLineDash([8, 4, 2, 4]);
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(0, wy(0));
  ctx.lineTo(w, wy(0));
  ctx.stroke();
  ctx.restore();

  // 再生位置
  const play = playAt(state.playhead);
  const playActive = state.playhead < 1;

  // --- 原位置マーカー ---
  for (const t of d.tools) {
    const o = origins[t];
    if (!o || !isFinite(o.x) || !isFinite(o.z)) continue;
    ctx.save();
    ctx.strokeStyle = toolColor(t);
    ctx.fillStyle = toolColor(t);
    ctx.lineWidth = 1.4;
    ctx.setLineDash([]);
    for (const sign of [1, -1]) {
      const px = wx(o.z), py = wy(sign * o.x / 2), rr = 6;
      ctx.beginPath(); ctx.arc(px, py, rr, 0, Math.PI * 2); ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(px - rr - 3, py); ctx.lineTo(px + rr + 3, py);
      ctx.moveTo(px, py - rr - 3); ctx.lineTo(px, py + rr + 3);
      ctx.stroke();
    }
    ctx.restore();
  }

  // --- セグメント（上下ミラー） ---
  for (let i = 0; i < d.segs.length; i++) {
    const s = d.segs[i];
    if (playActive && i > play.idx) continue; // 再生位置より先は未描画
    const partial = playActive && i === play.idx && !play.waiting;
    const isRapid = s.type === 0;
    if (isRapid && !showRapid) continue;
    const hovered = state.hoverSeg === s;
    const col = isRapid ? colRapid : toolColor(s.tool);
    ctx.save();
    ctx.strokeStyle = col;
    ctx.lineWidth = hovered ? 3.5 : (isRapid ? 1 : 1.8);
    ctx.globalAlpha = isRapid ? 0.75 : 1;
    ctx.setLineDash(isRapid ? [5, 4] : []);
    for (const sign of [1, -1]) {
      if (partial) {
        drawSegPartial(s, play.t, sign);
      } else if (s.type === 2 || s.type === 3) {
        const ap = arcParams(s, flip);
        if (ap) { drawArcPolyline(ap, sign); }
        else {
          ctx.beginPath();
          ctx.moveTo(wx(s.z0), wy(sign * s.x0 / 2));
          ctx.lineTo(wx(s.z1), wy(sign * s.x1 / 2));
          ctx.stroke();
        }
      } else {
        ctx.beginPath();
        ctx.moveTo(wx(s.z0), wy(sign * s.x0 / 2));
        ctx.lineTo(wx(s.z1), wy(sign * s.x1 / 2));
        ctx.stroke();
      }
    }
    ctx.restore();

    // 方向矢印（セグメント中点、部分描画中はスキップ）
    if (showDir && !partial) {
      const mid = segPointAt(s, 0.5);
      for (const sign of [1, -1]) {
        const px = wx(mid.z), py = wy(sign * mid.r);
        drawArrowHead(px, py, worldAngToScreen(mid.ang, sign), col, 6);
      }
    }
  }

  // --- 再生先端マーカー ---
  if (playActive && play.idx >= 0) {
    const s = d.segs[play.idx];
    const p = segPointAt(s, play.t);
    ctx.save();
    for (const sign of [1, -1]) {
      const px = wx(p.z), py = wy(sign * p.r);
      ctx.beginPath();
      ctx.fillStyle = toolColor(s.tool);
      ctx.strokeStyle = "#fff";
      ctx.lineWidth = 2;
      ctx.arc(px, py, 5, 0, Math.PI * 2);
      ctx.fill(); ctx.stroke();
      drawArrowHead(px, py, worldAngToScreen(p.ang, sign), toolColor(s.tool), 9);
    }
    ctx.restore();
    // ドウェル・工具交換などで止まっている間は、何を待っているかを出す
    if (play.waiting) {
      ctx.save();
      ctx.font = "11px system-ui, sans-serif";
      ctx.textAlign = "left"; ctx.textBaseline = "middle";
      labelBox(wx(p.z) + 12, wy(p.r) - 14,
        "\u23f1 " + play.waiting.label + " " + fmtSec(play.waiting.sec), colWait, null);
      ctx.restore();
    }
  }

  // ホバー点の強調
  if (state.hoverSeg) {
    const s = state.hoverSeg;
    ctx.save();
    ctx.fillStyle = toolColor(s.tool);
    for (const sign of [1, -1]) {
      for (const p of [[s.z0, s.x0], [s.z1, s.x1]]) {
        ctx.beginPath();
        ctx.arc(wx(p[0]), wy(sign * p[1] / 2), 3.2, 0, Math.PI * 2);
        ctx.fill();
      }
    }
    ctx.restore();
  }

  // --- 加工時間ラベル ---
  drawTimeLabels(play, playActive);

  // --- 交点測定 ---
  drawIntersections(colMuted);

  // --- 座標アシスト ---
  drawEditPreview();
}

// 座標アシスト：選択セグメントの強調と、保留中の編集値のゴースト線
function drawEditPreview() {
  const seg = editSeg();
  if (!seg) return;
  const css = getComputedStyle(document.documentElement);
  const acc = css.getPropertyValue("--accent").trim();

  // 選択中セグメントを太線で強調
  ctx.save();
  ctx.strokeStyle = acc;
  ctx.lineWidth = 3;
  ctx.globalAlpha = 0.55;
  for (const sign of [1, -1]) {
    if (isArcSeg(seg)) {
      const ap = arcParams(seg, document.getElementById("flipArc").checked);
      if (ap) { drawArcPolyline(ap, sign); continue; }   // 内部で stroke 済み
    }
    ctx.beginPath();
    ctx.moveTo(wx(seg.z0), wy(sign * seg.x0 / 2));
    ctx.lineTo(wx(seg.z1), wy(sign * seg.x1 / 2));
    ctx.stroke();
  }
  ctx.restore();

  // 保留中の編集がなければここまで
  const ed = state.edit;
  if (!ed || ed.err) return;
  const NE = (a, b) => Math.abs(a - b) > 1e-9;
  const startMoved = NE(ed.x0, seg.x0) || NE(ed.z0, seg.z0);
  if (!startMoved && !NE(ed.x1, seg.x1) && !NE(ed.z1, seg.z1)) return;

  ctx.save();
  ctx.strokeStyle = acc;
  ctx.lineWidth = 2;
  ctx.setLineDash([7, 4]);
  // 新しい始点 → 新しい終点
  for (const sign of [1, -1]) {
    ctx.beginPath();
    ctx.moveTo(wx(ed.z0), wy(sign * ed.x0 / 2));
    ctx.lineTo(wx(ed.z1), wy(sign * ed.x1 / 2));
    ctx.stroke();
  }
  // 始点が動くなら前ブロックも一緒に変わるので、そのゴースト線も描く
  const prev = startMoved ? prevSegOf(seg) : null;
  if (prev && ed.startEditable) {
    ctx.globalAlpha = 0.7;
    for (const sign of [1, -1]) {
      ctx.beginPath();
      ctx.moveTo(wx(prev.z0), wy(sign * prev.x0 / 2));
      ctx.lineTo(wx(ed.z0), wy(sign * ed.x0 / 2));
      ctx.stroke();
    }
    ctx.globalAlpha = 1;
  }
  ctx.setLineDash([]);

  // 端点マーカー＋座標ラベル（上半分のみ）
  const label = (v, wxv, wyv) => {
    ctx.font = "12px system-ui, sans-serif";
    const tw = ctx.measureText(v).width;
    ctx.fillStyle = css.getPropertyValue("--panel").trim();
    ctx.globalAlpha = 0.9;
    ctx.fillRect(wxv - 3, wyv - 13, tw + 6, 17);
    ctx.globalAlpha = 1;
    ctx.strokeStyle = acc;
    ctx.lineWidth = 1;
    ctx.strokeRect(wxv - 3, wyv - 13, tw + 6, 17);
    ctx.fillStyle = css.getPropertyValue("--text").trim();
    ctx.textAlign = "left"; ctx.textBaseline = "alphabetic";
    ctx.fillText(v, wxv, wyv);
  };
  const pts = startMoved ? [[ed.x0, ed.z0], [ed.x1, ed.z1]] : [[ed.x1, ed.z1]];
  for (const [px, pz] of pts) {
    ctx.fillStyle = acc;
    for (const sign of [1, -1]) {
      ctx.beginPath();
      ctx.arc(wx(pz), wy(sign * px / 2), 3.5, 0, Math.PI * 2);
      ctx.fill();
    }
    label(`⌀${fmt(px)} Z${fmt(pz)}`, wx(pz) + 9, wy(px / 2) - 9);
  }

  // 交点モード：保留中の交点までゴースト線を延長し、× マーカーと座標を出す
  const ixi = parseIxField(ed.auto);
  if (ixi && ed.ixList[ixi.i]) {
    const e = ed.ixList[ixi.i];
    const anchorEnd = ed.ixAnchor !== "start";
    const az = anchorEnd ? ed.z1 : ed.z0, ar = (anchorEnd ? ed.x1 : ed.x0) / 2;
    ctx.setLineDash([3, 3]);
    ctx.strokeStyle = acc;
    ctx.lineWidth = 1.5;
    for (const sign of [1, -1]) {
      ctx.beginPath();
      ctx.moveTo(wx(az), wy(sign * ar));
      ctx.lineTo(wx(e.z), wy(sign * e.r));
      ctx.stroke();
    }
    ctx.setLineDash([]);
    ctx.lineWidth = 2;
    for (const sign of [1, -1]) {
      const mx = wx(e.z), my = wy(sign * e.r), m = 5;
      ctx.beginPath();
      ctx.moveTo(mx - m, my - m); ctx.lineTo(mx + m, my + m);
      ctx.moveTo(mx - m, my + m); ctx.lineTo(mx + m, my - m);
      ctx.stroke();
    }
    label(`⌀${fmt(e.r * 2)} Z${fmt(e.z)}`, wx(e.z) + 9, wy(e.r) - 9);
  }
  ctx.restore();
}

// 交点測定の描画：選択中の1本目ハイライト＋確定した交点の延長線・マーカー・座標
// 背景を塗った枠付きラベル。boxes を渡すと既存のラベルと重なる位置は描かない
function labelBox(px, py, text, color, boxes) {
  const tw = ctx.measureText(text).width;
  const b = [px - 3, py - 8, tw + 6, 17];
  if (boxes) {
    for (const o of boxes) {
      if (b[0] < o[0] + o[2] && b[0] + b[2] > o[0] && b[1] < o[1] + o[3] && b[1] + b[3] > o[1]) return false;
    }
    boxes.push(b);
  }
  const css = getComputedStyle(document.documentElement);
  ctx.save();
  ctx.setLineDash([]);
  ctx.globalAlpha = 0.9;
  ctx.fillStyle = css.getPropertyValue("--panel").trim();
  ctx.fillRect(b[0], b[1], b[2], b[3]);
  ctx.globalAlpha = 1;
  ctx.lineWidth = 1;
  ctx.strokeStyle = color;
  ctx.strokeRect(b[0] + 0.5, b[1] + 0.5, b[2] - 1, b[3] - 1);
  ctx.fillStyle = color;
  ctx.fillText(text, px, py);
  ctx.restore();
  return true;
}

// このセグメントのラベルを図に出すか（種別トグル＋行ごとの個別指定）
function timeLabelVisible(s) {
  return state.timeCats[s.cat] && !state.timeHidden.has(s.line);
}

// --- 各ブロックの所要時間を図に焼き込む ---
// 重なるラベルは描かないので、画面上で短い線は自然に省かれる（ズームすれば出る）
function drawTimeLabels(play, playActive) {
  if (!document.getElementById("showTime").checked) return;
  const d = state.data;
  if (!d) return;
  const showRapid = document.getElementById("showRapid").checked;
  const css = getComputedStyle(document.documentElement);
  const colTime = css.getPropertyValue("--time").trim();
  const colWait = css.getPropertyValue("--time-wait").trim();
  const w = wrap.clientWidth, h = wrap.clientHeight;
  const boxes = [];
  ctx.save();
  ctx.font = "11px system-ui, sans-serif";
  ctx.textAlign = "left"; ctx.textBaseline = "middle";

  // 待ち（ドウェル・工具交換など）は直前のセグメント終点に付ける
  const endOf = new Map();   // 行番号 → その行までに到達している点
  let last = null;
  for (const st of d.steps) {
    if (st.kind === "move") { last = st.seg; continue; }
    if (last) endOf.set(st.evt, { z: last.z1, r: last.x1 / 2 });
  }

  // 待ち（ドウェル・工具交換など）を先に描く。細かい移動ラベルより情報量が多いので優先させる
  const upto = playActive ? play.stepIdx : d.steps.length - 1;
  for (let i = 0; i <= upto; i++) {
    const st = d.steps[i];
    if (st.kind !== "wait") continue;
    const e = st.evt;
    if (!state.timeCats[e.cat] || state.timeHidden.has(e.line) || !(e.sec > 0)) continue;
    if (playActive && play.waiting === e) continue;   // 再生中の待ちは先端バッジで出している
    const at = endOf.get(e);
    if (!at) continue;
    const px = wx(at.z) + 7, py = wy(at.r) + 11;
    if (px < -100 || px > w + 100 || py < -20 || py > h + 20) continue;
    labelBox(px, py, e.label + " " + fmtSec(e.sec), colWait, boxes);
  }
  for (let i = 0; i <= upto; i++) {
    const st = d.steps[i];
    if (st.kind !== "move") continue;
    const sg = st.seg;
    if (sg.type === 0 && !showRapid) continue;
    if (!timeLabelVisible(sg)) continue;
    const mid = segPointAt(sg, 0.5);
    const px = wx(mid.z) + 7, py = wy(mid.r) - 9;
    if (px < -60 || px > w + 60 || py < -20 || py > h + 20) continue;
    labelBox(px, py, fmtSec(sg.sec) + (sg.est ? " ?" : ""), colTime, boxes);
  }
  ctx.restore();
}

function drawIntersections(colMuted) {
  // 選択中の1本目を強調
  if (state.ixFirst) {
    const s = state.ixFirst;
    ctx.save();
    ctx.strokeStyle = "#e11d48";
    ctx.lineWidth = 3;
    ctx.setLineDash([6, 4]);
    for (const sign of [1, -1]) {
      ctx.beginPath();
      ctx.moveTo(wx(s.z0), wy(sign * s.x0 / 2));
      ctx.lineTo(wx(s.z1), wy(sign * s.x1 / 2));
      ctx.stroke();
    }
    ctx.restore();
  }

  for (const p of state.ixPoints) {
    const ip = ixResolve(p);
    if (!ip) continue;             // 行が消えた/平行になった交点は描かない
    // 元2線から交点までの延長線（点線・淡色）
    ctx.save();
    ctx.setLineDash([3, 3]);
    ctx.lineWidth = 1;
    ctx.globalAlpha = 0.6;
    for (const seg of [ip.a, ip.b]) {
      ctx.strokeStyle = toolColor(seg.tool);
      // 交点に近い端点から交点へ
      const r0 = seg.x0 / 2, r1 = seg.x1 / 2;
      const d0 = Math.hypot(seg.z0 - ip.z, r0 - ip.r);
      const d1 = Math.hypot(seg.z1 - ip.z, r1 - ip.r);
      const near = d0 < d1 ? { z: seg.z0, r: r0 } : { z: seg.z1, r: r1 };
      for (const sign of [1, -1]) {
        ctx.beginPath();
        ctx.moveTo(wx(near.z), wy(sign * near.r));
        ctx.lineTo(wx(ip.z), wy(sign * ip.r));
        ctx.stroke();
      }
    }
    ctx.restore();

    // ×マーカー（上下）＋座標ラベル（上半分のみ）
    ctx.save();
    ctx.strokeStyle = "#e11d48";
    ctx.fillStyle = "#e11d48";
    ctx.lineWidth = 2;
    ctx.setLineDash([]);
    for (const sign of [1, -1]) {
      const px = wx(ip.z), py = wy(sign * ip.r), m = 5;
      ctx.beginPath();
      ctx.moveTo(px - m, py - m); ctx.lineTo(px + m, py + m);
      ctx.moveTo(px - m, py + m); ctx.lineTo(px + m, py - m);
      ctx.stroke();
    }
    // ラベル
    const label = `⌀${fmt(ip.r * 2)} Z${fmt(ip.z)}`;
    const lx = wx(ip.z) + 9, ly = wy(ip.r) - 9;
    ctx.font = "12px system-ui, sans-serif";
    const tw = ctx.measureText(label).width;
    const css = getComputedStyle(document.documentElement);
    ctx.fillStyle = css.getPropertyValue("--panel").trim();
    ctx.globalAlpha = 0.9;
    ctx.fillRect(lx - 3, ly - 13, tw + 6, 17);
    ctx.globalAlpha = 1;
    ctx.strokeStyle = "#e11d48";
    ctx.lineWidth = 1;
    ctx.strokeRect(lx - 3, ly - 13, tw + 6, 17);
    ctx.fillStyle = css.getPropertyValue("--text").trim();
    ctx.textAlign = "left"; ctx.textBaseline = "alphabetic";
    ctx.fillText(label, lx, ly);
    ctx.restore();
  }
}

// 円弧を点列で描画（現在のctxパス設定を使用）
function drawArcPolyline(ap, sign) {
  const N = 48;
  let sweep = ap.a1 - ap.a0;
  if (ap.cw) { while (sweep > 0) sweep -= 2 * Math.PI; }
  else       { while (sweep < 0) sweep += 2 * Math.PI; }
  ctx.beginPath();
  for (let k = 0; k <= N; k++) {
    const a = ap.a0 + sweep * (k / N);
    const zz = ap.cz + ap.R * Math.cos(a);
    const rr = ap.cr + ap.R * Math.sin(a);
    const px = wx(zz), py = wy(sign * rr);
    if (k === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
  }
  ctx.stroke();
}

// playhead(0..1) → { idx, t, waiting, stepIdx }
//   idx     … 描き終えるべき最後のセグメント番号（-1 = まだ1本も描かない）
//   t       … そのセグメント内の割合 0..1
//   waiting … 待ち（ドウェル・工具交換など）の最中ならそのイベント
// 時間軸は移動と待ちを実行順に並べた steps。ドウェル中は先端が止まる。
function playAt(p) {
  const d = state.data;
  if (!d || !d.steps || !d.steps.length) return { idx: -1, t: 0, waiting: null, stepIdx: -1 };
  if (p >= 1) return { idx: d.segs.length - 1, t: 1, waiting: null, stepIdx: d.steps.length - 1 };
  const target = Math.max(0, p) * d.totalT;
  let si = d.steps.length - 1;
  for (let i = 0; i < d.steps.length; i++) {
    if (target < d.cumT[i + 1]) { si = i; break; }
  }
  const st = d.steps[si];
  const done = d.doneBefore[si];
  if (st.kind === "wait") return { idx: done - 1, t: 1, waiting: st.evt, stepIdx: si };
  const span = d.cumT[si + 1] - d.cumT[si];
  const local = span > 0 ? (target - d.cumT[si]) / span : 0;
  return { idx: done, t: Math.max(0, Math.min(1, local)), waiting: null, stepIdx: si };
}

// セグメント上の点（ワールド (z, r)）。r は上半分（r=x/2）。t=0..1
function segPointAt(s, t, flip) {
  if (s.type === 2 || s.type === 3) {
    const ap = arcParams(s, arcFlip(flip));
    if (ap) {
      let sweep = ap.a1 - ap.a0;
      if (ap.cw) { while (sweep > 0) sweep -= 2 * Math.PI; } else { while (sweep < 0) sweep += 2 * Math.PI; }
      const a = ap.a0 + sweep * t;
      return { z: ap.cz + ap.R * Math.cos(a), r: ap.cr + ap.R * Math.sin(a),
               ang: a + (ap.cw ? -Math.PI / 2 : Math.PI / 2) }; // 接線方向（進行）
    }
  }
  const z = s.z0 + (s.z1 - s.z0) * t;
  const r = (s.x0 + (s.x1 - s.x0) * t) / 2;
  const ang = Math.atan2((s.x1 - s.x0) / 2, s.z1 - s.z0);
  return { z, r, ang };
}

// セグメントを t=0..upto まで描画（現在の ctx 設定を使用、上下ミラー sign）
function drawSegPartial(s, upto, sign) {
  ctx.beginPath();
  if (s.type === 2 || s.type === 3) {
    const ap = arcParams(s, flipOn());
    if (ap) {
      let sweep = ap.a1 - ap.a0;
      if (ap.cw) { while (sweep > 0) sweep -= 2 * Math.PI; } else { while (sweep < 0) sweep += 2 * Math.PI; }
      const N = Math.max(2, Math.ceil(48 * upto));
      for (let k = 0; k <= N; k++) {
        const a = ap.a0 + sweep * upto * (k / N);
        const px = wx(ap.cz + ap.R * Math.cos(a)), py = wy(sign * (ap.cr + ap.R * Math.sin(a)));
        if (k === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
      }
      ctx.stroke();
      return;
    }
  }
  const z = s.z0 + (s.z1 - s.z0) * upto;
  const r1 = (s.x0 + (s.x1 - s.x0) * upto) / 2;
  ctx.moveTo(wx(s.z0), wy(sign * s.x0 / 2));
  ctx.lineTo(wx(z), wy(sign * r1));
  ctx.stroke();
}

// 進行方向の矢印ヘッドをスクリーン(px,py)に角度angで描画（ワールド角→スクリーン角に変換済みを渡す）
function drawArrowHead(px, py, screenAng, color, size) {
  size = size || 7;
  ctx.save();
  ctx.fillStyle = color;
  ctx.globalAlpha = 1;
  ctx.setLineDash([]);
  ctx.translate(px, py);
  ctx.rotate(screenAng);
  ctx.beginPath();
  ctx.moveTo(0, 0);
  ctx.lineTo(-size, -size * 0.5);
  ctx.lineTo(-size, size * 0.5);
  ctx.closePath();
  ctx.fill();
  ctx.restore();
}

// ワールドの進行角(ang: +z右, +r上) を、上下ミラー sign のスクリーン角へ変換
function worldAngToScreen(ang, sign) {
  // スクリーン: x=+z方向そのまま, y=-（sign*r）方向。dz=cos(ang), dr=sin(ang)
  const dz = Math.cos(ang), dr = Math.sin(ang);
  return Math.atan2(-sign * dr, dz);
}

function niceStep(rawStep) {
  const pow = Math.pow(10, Math.floor(Math.log10(rawStep)));
  const n = rawStep / pow;
  let f;
  if (n < 1.5) f = 1; else if (n < 3) f = 2; else if (n < 7) f = 5; else f = 10;
  return f * pow;
}

function drawGrid(w, h, colGrid, colAxis, colMuted, showLabels) {
  const targetPx = 80;
  const step = niceStep(targetPx / state.scale);
  ctx.save();
  ctx.lineWidth = 1;
  ctx.font = "11px system-ui, sans-serif";
  ctx.fillStyle = colMuted;

  // 縦線（Z一定）
  const zLeft = sxToZ(0), zRight = sxToZ(w);
  const z0 = Math.ceil(zLeft / step) * step;
  for (let z = z0; z <= zRight; z += step) {
    const px = wx(z);
    ctx.strokeStyle = colGrid;
    ctx.beginPath(); ctx.moveTo(px, 0); ctx.lineTo(px, h); ctx.stroke();
    if (showLabels) {
      ctx.textAlign = "center"; ctx.textBaseline = "bottom";
      ctx.fillText("Z" + fmt(z), px, h - 2);
    }
  }
  // 横線（r一定 → 直径ラベル）
  const rTop = syToR(0), rBot = syToR(h);
  const r0 = Math.ceil(rBot / step) * step;
  for (let r = r0; r <= rTop; r += step) {
    const py = wy(r);
    ctx.strokeStyle = colGrid;
    ctx.beginPath(); ctx.moveTo(0, py); ctx.lineTo(w, py); ctx.stroke();
    if (showLabels && Math.abs(r) > 1e-9) {
      ctx.textAlign = "left"; ctx.textBaseline = "middle";
      ctx.fillText("⌀" + fmt(Math.abs(r) * 2), 3, py); // 直径表示
    }
  }
  ctx.restore();
}

function fmt(v) {
  const r = Math.round(v * 1000) / 1000;
  return (Math.abs(r) < 1e-9 ? 0 : r).toString();
}

// ===== インタラクション =====
function hitTest(px, py) {
  const d = state.data;
  if (!d) return null;
  const showRapid = document.getElementById("showRapid").checked;
  let best = null, bestDist = 7; // px 閾値
  for (const s of d.segs) {
    if (s.type === 0 && !showRapid) continue;
    for (const sign of [1, -1]) {
      // 直線近似（円弧も端点間の折れ線サンプルで近似）
      let pts;
      if (s.type === 2 || s.type === 3) {
        const ap = arcParams(s, flipOn());
        pts = [];
        if (ap) {
          let sweep = ap.a1 - ap.a0;
          if (ap.cw) { while (sweep > 0) sweep -= 2*Math.PI; } else { while (sweep < 0) sweep += 2*Math.PI; }
          for (let k = 0; k <= 16; k++) {
            const a = ap.a0 + sweep * (k/16);
            pts.push([wx(ap.cz + ap.R*Math.cos(a)), wy(sign*(ap.cr + ap.R*Math.sin(a)))]);
          }
        } else {
          pts = [[wx(s.z0), wy(sign*s.x0/2)], [wx(s.z1), wy(sign*s.x1/2)]];
        }
      } else {
        pts = [[wx(s.z0), wy(sign*s.x0/2)], [wx(s.z1), wy(sign*s.x1/2)]];
      }
      for (let k = 0; k < pts.length - 1; k++) {
        const dist = distToSeg(px, py, pts[k][0], pts[k][1], pts[k+1][0], pts[k+1][1]);
        if (dist < bestDist) { bestDist = dist; best = s; }
      }
    }
  }
  return best;
}

function distToSeg(px, py, x1, y1, x2, y2) {
  const dx = x2 - x1, dy = y2 - y1;
  const len2 = dx*dx + dy*dy;
  let t = len2 ? ((px-x1)*dx + (py-y1)*dy) / len2 : 0;
  t = Math.max(0, Math.min(1, t));
  const cx = x1 + t*dx, cy = y1 + t*dy;
  return Math.hypot(px - cx, py - cy);
}

// G1(直線切削)のみを対象に最近傍セグメントを返す（交点測定用）
function pickG1(px, py) {
  const d = state.data;
  if (!d) return null;
  let best = null, bestDist = 8;
  for (const s of d.segs) {
    if (s.type !== 1) continue;
    for (const sign of [1, -1]) {
      const dist = distToSeg(px, py, wx(s.z0), wy(sign*s.x0/2), wx(s.z1), wy(sign*s.x1/2));
      if (dist < bestDist) { bestDist = dist; best = s; }
    }
  }
  return best;
}

// 2本のG1セグメントを無限直線とみなした交点（ワールド (z, r), r=x/2）。平行なら null
function lineIntersect(a, b) {
  const pa = { z: a.z0, r: a.x0/2 }, da = { z: a.z1 - a.z0, r: (a.x1 - a.x0)/2 };
  const pb = { z: b.z0, r: b.x0/2 }, db = { z: b.z1 - b.z0, r: (b.x1 - b.x0)/2 };
  const den = da.z * db.r - da.r * db.z;
  if (Math.abs(den) < 1e-9) return null; // 平行
  const t = ((pb.z - pa.z) * db.r - (pb.r - pa.r) * db.z) / den;
  return { z: pa.z + t * da.z, r: pa.r + t * da.r };
}

// 交点は行番号だけ保持し、座標は毎回その時点のセグメントから解き直す。
// （セグメントの実体を持つと reparse で作り直された瞬間に古い座標で固まるため）
function ixResolve(p) {
  const d = state.data;
  if (!d) return null;
  const a = d.segs.find(s => s.line === p.aLine);
  const b = d.segs.find(s => s.line === p.bLine);
  if (!a || !b) return null;
  const ip = lineIntersect(a, b);
  return ip ? { a, b, z: ip.z, r: ip.r } : null;
}

const G_NAME = { 0: "G0 早送り", 1: "G1 切削", 2: "G2 円弧(CW)", 3: "G3 円弧(CCW)" };

// G1テーパ線の水平(Z軸)からの角度（半径基準・符号付き -90〜90°）。テーパでなければ null
// 符号の定義は signedAngle() を参照。大きさは従来どおり鋭角。
function taperAngle(s) {
  if (s.type !== 1) return null;
  const ang = signedTaperAngle(s);
  if (ang == null) return null;
  const mag = Math.abs(ang);
  if (mag <= 0.5 || mag >= 89.5) return null; // 外径(≈0°)・端面(≈90°)は除外
  return ang;
}

// 符号付きテーパ角（半径基準・水平=Z軸から、(-90, 90]）
//   0°=外径(Z軸平行) / ±90°=端面(X軸平行) / +=Z+方向へ半径拡大
// 線の傾きそのものなので、進行方向(Z+へ切るかZ-へ切るか)には依存しない。
function signedAngle(x0, z0, x1, z1) {
  const dr = (x1 - x0) / 2, dz = z1 - z0;
  if (Math.abs(dz) < 1e-9) {
    if (Math.abs(dr) < 1e-9) return null;   // 始点＝終点
    return dr > 0 ? 90 : -90;
  }
  return Math.atan(dr / dz) * 180 / Math.PI;
}
function signedTaperAngle(s) { return signedAngle(s.x0, s.z0, s.x1, s.z1); }
// 符号を明示した角度表記（+ は Z+方向へ半径拡大）
function angStr(a) { return (a > 0 ? "+" : "") + a.toFixed(2) + "°"; }

// 直線上のある座標から、もう一方の座標を求める（線は無限直線として扱う）
//   axis "z" … z を与えて半径 r を返す / axis "r" … r を与えて z を返す
// 与えた軸方向にその線が退化していれば null（例：端面の線に対して z を与える）
function pointOnLineAt(seg, axis, v) {
  const z0 = seg.z0, r0 = seg.x0 / 2, dz = seg.z1 - seg.z0, dr = (seg.x1 - seg.x0) / 2;
  if (axis === "z") {
    if (Math.abs(dz) < 1e-9) return null;      // Z一定の線（端面）では z を指定できない
    return { z: v, r: r0 + (v - z0) * dr / dz };
  }
  if (Math.abs(dr) < 1e-9) return null;        // 半径一定の線（外径）では ⌀X を指定できない
  return { z: z0 + (v - r0) * dz / dr, r: v };
}

// 交点モードの逆算：交点の1軸を与えて、交点のもう1軸・角度・動く端点を決める。
// 線P（相手線）と線N（隣ブロックの線）は固定。アンカー端点も固定。
function solveByIntersection(edit) {
  const pf = parseIxField(edit.auto);
  const entry = edit.ixList[pf.i];
  const reason = ixBlockReason(edit, entry);
  if (reason) { edit.err = reason; return; }

  // 1) 交点は相手線 P 上にある → 与えた軸から残りの軸が決まる
  const givenIsZ = pf.kind === "ipx";           // ⌀Xが自動 ⇒ Zを入力
  const ip = givenIsZ ? pointOnLineAt(entry.partner, "z", entry.z)
                      : pointOnLineAt(entry.partner, "r", entry.r);
  if (!ip) {
    edit.err = givenIsZ ? `相手線(行${entry.partner.line})はZ一定のため交点Zを動かせません。自動を交点Zにして⌀Xで入力してください。`
                        : `相手線(行${entry.partner.line})は⌀X一定のため交点⌀Xを動かせません。自動を交点⌀Xにして Z で入力してください。`;
    return;
  }
  entry.z = ip.z; entry.r = ip.r;

  // 2) 線A = アンカーと交点を通る直線 → 角度が決まる
  const anchorEnd = edit.ixAnchor !== "start";
  const ax = anchorEnd ? edit.x1 : edit.x0, az = anchorEnd ? edit.z1 : edit.z0;
  const ang = signedAngle(ax, az, ip.r * 2, ip.z);
  if (ang == null) { edit.err = "アンカーと交点が同じ位置のため線が決まりません。"; return; }
  edit.ang = ang;

  // 3) 動く端点 = 線A × 線N（隣ブロックの線）
  const lineA = { x0: ax, z0: az, x1: ip.r * 2, z1: ip.z };
  const n = anchorEnd ? edit.prevSeg : edit.nextSeg;
  const hit = lineIntersect(lineA, n);
  if (!hit) { edit.err = `${anchorEnd ? "前" : "次"}ブロック(行${n.line})が新しい線と平行のため端点が決まりません。`; return; }
  if (anchorEnd) { edit.x0 = hit.r * 2; edit.z0 = hit.z; }
  else           { edit.x1 = hit.r * 2; edit.z1 = hit.z; }
}

// edit.auto の値を残り（始点⌀X/始点Z/終点⌀X/終点Z/角度 のうち他の4つ）から逆算する。
// 5値・拘束1本＝自由度4なので、4つ与えれば残り1つが決まる。不能なら edit.err に文言を入れる。
// auto が交点フィールドのときは solveByIntersection に委ねる（拘束が増えて自由度3になる）。
function solveAuto(edit) {
  edit.err = null;
  if (parseIxField(edit.auto)) { solveByIntersection(edit); return; }
  const TOL = 1e-6;
  const isFace = Math.abs(Math.abs(edit.ang) - 90) < TOL;   // 端面（X軸平行）
  const isOd = Math.abs(edit.ang) < TOL;                    // 外径（Z軸平行）
  const t = Math.tan(edit.ang * Math.PI / 180);
  const dr = (edit.x1 - edit.x0) / 2;
  const dz = edit.z1 - edit.z0;

  // Z を解く（終点Z / 始点Z 共通）。Z方向の差は dr/tanθ で決まる
  if (edit.auto === "z1" || edit.auto === "z0") {
    let d;                                    // 求めるZ方向の差 (z1 - z0)
    if (isFace) d = 0;
    else if (Math.abs(t) < 1e-9) {
      if (Math.abs(dr) < 1e-9) return;        // 外径線かつ⌀X差なし：Zは自由（現状維持）
      edit.err = `角度0°（外径）では${edit.auto === "z1" ? "終点" : "始点"}Zが決まりません。角度か自動対象を変えてください。`;
      return;
    } else d = dr / t;
    if (edit.auto === "z1") edit.z1 = edit.z0 + d;
    else edit.z0 = edit.z1 - d;

  // ⌀X を解く（終点⌀X / 始点⌀X 共通）。半径差は dz·tanθ で決まる
  } else if (edit.auto === "x1" || edit.auto === "x0") {
    let d;                                    // 求める直径差 (x1 - x0)
    if (isOd) d = 0;
    else if (isFace) {
      if (Math.abs(dz) < 1e-9) return;        // 端面かつZ差なし：⌀Xは自由（現状維持）
      edit.err = `角度±90°（端面）では${edit.auto === "x1" ? "終点" : "始点"}⌀Xが決まりません。角度か自動対象を変えてください。`;
      return;
    } else d = 2 * dz * t;
    if (edit.auto === "x1") edit.x1 = edit.x0 + d;
    else edit.x0 = edit.x1 - d;

  } else if (edit.auto === "ang") {
    const a = signedAngle(edit.x0, edit.z0, edit.x1, edit.z1);
    if (a == null) { edit.err = "始点と終点が同一のため角度が決まりません。"; return; }
    edit.ang = a;
  }
}

// ===== NCテキスト書き換え =====
// 数値整形。小数点は必ず残す（Fanucでは "X42" は 0.042mm と解釈されるため）
function ncNum(v) {
  if (Math.abs(v) < 5e-4) v = 0;             // -0. を避ける
  let s = v.toFixed(3);
  s = s.replace(/0+$/, "");                  // 末尾ゼロ除去 42.000→"42." / -11.250→"-11.25"
  if (!s.includes(".")) s += ".";
  return s;
}

// 行を「コード部」と「(コメント)部」に分割する。括弧内は代替寸法などが入るため書き換え対象外。
// 閉じ括弧が無い場合はパーサ側と同様にコードとして扱う。
function splitCodeParts(line) {
  const parts = [];
  let buf = "", inC = false;
  for (const ch of line) {
    if (!inC && ch === "(") {
      if (buf) parts.push({ text: buf, isComment: false });
      buf = ch; inC = true;
    } else if (inC && ch === ")") {
      buf += ch; parts.push({ text: buf, isComment: true }); buf = ""; inC = false;
    } else {
      buf += ch;
    }
  }
  if (buf) parts.push({ text: buf, isComment: false });
  return parts;
}
function joinParts(parts) { return parts.map(p => p.text).join(""); }

// ブロック内のワード順の慣例。語を新設するときの挿入位置を決めるのに使う
const WORD_RANK = { N: -1, O: -1, G: 0, X: 1, U: 1, Z: 2, W: 2, R: 3, I: 3, K: 3, T: 4, F: 5, S: 6, M: 7 };

// 行の座標語を書き換える（コード部のみ対象）。
// cands: [{L:"X", inc:false}, {L:"U", inc:true}] のように候補を優先順に並べる。
// 該当語が無ければ新設し、最初の F/M/S 語の直前に挿入する。
function setWord(line, cands, absVal, startVal) {
  const parts = splitCodeParts(line);
  for (const c of cands) {
    const re = new RegExp("(" + c.L + ")\\s*([+-]?[0-9]*\\.?[0-9]+)", "i");
    for (const p of parts) {
      if (p.isComment || !re.test(p.text)) continue;
      const v = c.inc ? absVal - startVal : absVal;
      p.text = p.text.replace(re, (m, l) => l + ncNum(v));
      return joinParts(parts);
    }
  }
  // 新設：慣例のワード順（N/O → G → X/U → Z/W → R/I/K → T → F → S → M）を保つよう、
  // 自分より後ろに来るべき最初の語の直前に挿入する
  const word = cands[0].L + ncNum(cands[0].inc ? absVal - startVal : absVal);
  const rank = WORD_RANK[cands[0].L.toUpperCase()];
  const reWord = /([A-Za-z])\s*[+-]?[0-9]*\.?[0-9]+/g;
  for (const p of parts) {
    if (p.isComment) continue;
    reWord.lastIndex = 0;
    let m;
    while ((m = reWord.exec(p.text)) !== null) {
      const r = WORD_RANK[m[1].toUpperCase()];
      if (r != null && r > rank) {
        p.text = p.text.slice(0, m.index) + word + p.text.slice(m.index);
        return joinParts(parts);
      }
    }
  }
  for (let i = parts.length - 1; i >= 0; i--) {
    if (!parts[i].isComment) { parts[i].text += word; return joinParts(parts); }
  }
  return line + word;
}

// 行に触らなかった場合、その軸の終点がいくつになるか（始点が ed で動いたあとの値）
//   abs  … 行の絶対値のまま（始点が動いても不変）
//   inc  … 新しい始点 + 元の増分
//   none … 新しい始点そのもの（モーダル継承）
function inheritedEnd(line, absL, incL, newStart, segStart, segEnd) {
  switch (axisMode(line, absL, incL)) {
    case "abs": return segEnd;
    case "inc": return newStart + (segEnd - segStart);
    default:    return newStart;
  }
}

// 現ブロック行：終点を反映する。行に触らなくても正しい値になるなら書き換えない
// （＝省略/増分指定の軸は始点に追従させ、元のプログラム構造を保つ）
function buildEndLine(seg, ed) {
  let line = state.data.rawLines[seg.line - 1];
  const NE = (a, b) => isFinite(a) && Math.abs(a - b) > 1e-9;
  const x0 = isFinite(ed.x0) ? ed.x0 : seg.x0;
  const z0 = isFinite(ed.z0) ? ed.z0 : seg.z0;
  if (NE(ed.x1, inheritedEnd(line, "X", "U", x0, seg.x0, seg.x1)))
    line = setWord(line, [{ L: "X", inc: false }, { L: "U", inc: true }], ed.x1, x0);
  if (NE(ed.z1, inheritedEnd(line, "Z", "W", z0, seg.z0, seg.z1)))
    line = setWord(line, [{ L: "Z", inc: false }, { L: "W", inc: true }], ed.z1, z0);
  if (isArcSeg(seg) && seg.r != null && NE(ed.r, seg.r))
    line = setWord(line, [{ L: "R", inc: false }], ed.r, 0);
  return line;
}

// 前ブロック行：その終点（＝このブロックの始点）を反映する
function buildStartLine(prevSeg, ed) {
  let line = state.data.rawLines[prevSeg.line - 1];
  const NE = (a, b) => isFinite(a) && Math.abs(a - b) > 1e-9;
  if (NE(ed.x0, prevSeg.x1)) line = setWord(line, [{ L: "X", inc: false }, { L: "U", inc: true }], ed.x0, prevSeg.x0);
  if (NE(ed.z0, prevSeg.z1)) line = setWord(line, [{ L: "Z", inc: false }, { L: "W", inc: true }], ed.z0, prevSeg.z0);
  return line;
}
function isArcSeg(s) { return s.type === 2 || s.type === 3; }

function showTooltip(s, clientX, clientY) {
  const rect = wrap.getBoundingClientRect();
  tooltip.style.display = "block";
  const ang = taperAngle(s);
  tooltip.innerHTML =
    `<b>${G_NAME[s.type] || "G"+s.type}</b> ・ 工具 T${s.tool} ・ 行 ${s.line}<br>` +
    `始: ⌀${fmt(s.x0)} Z${fmt(s.z0)}<br>` +
    `終: ⌀${fmt(s.x1)} Z${fmt(s.z1)}` +
    (s.r != null ? `<br>R${fmt(s.r)}` : "") +
    (ang != null ? `<br>水平から ∠${angStr(ang)}` : "") +
    timeTip(s);
  let tx = clientX - rect.left + 14, ty = clientY - rect.top + 14;
  if (tx + tooltip.offsetWidth > rect.width) tx = clientX - rect.left - tooltip.offsetWidth - 14;
  if (ty + tooltip.offsetHeight > rect.height) ty = clientY - rect.top - tooltip.offsetHeight - 14;
  tooltip.style.left = tx + "px";
  tooltip.style.top = ty + "px";
}
function hideTooltip() { tooltip.style.display = "none"; }

// ドラッグ（パン）
let dragging = false, lastX = 0, lastY = 0, downX = 0, downY = 0, moved = false;
cv.addEventListener("mousedown", e => {
  dragging = true; moved = false;
  lastX = downX = e.clientX; lastY = downY = e.clientY;
});
window.addEventListener("mouseup", () => { dragging = false; });
cv.addEventListener("mousemove", e => {
  if (dragging) {
    state.offsetX += e.clientX - lastX;
    state.offsetY += e.clientY - lastY;
    lastX = e.clientX; lastY = e.clientY;
    // 押下位置から一定距離動いて初めて「ドラッグ」とみなす
    // （移動量0のmousemoveでクリック選択が潰れるのを防ぐ）
    if (Math.abs(e.clientX - downX) + Math.abs(e.clientY - downY) > 3) moved = true;
    draw();
    return;
  }
  const rect = cv.getBoundingClientRect();
  const px = e.clientX - rect.left, py = e.clientY - rect.top;
  const hit = hitTest(px, py);
  if (hit !== state.hoverSeg) {
    state.hoverSeg = hit;
    draw();
    highlightSrc(hit ? hit.line : null);
  }
  if (hit) showTooltip(hit, e.clientX, e.clientY); else hideTooltip();
});
cv.addEventListener("mouseleave", () => { state.hoverSeg = null; hideTooltip(); highlightSrc(null); draw(); });

// 交点測定：クリックでG1線を2本選択
function ixModeOn() { return document.getElementById("ixMode").checked; }
function editModeOn() { return document.getElementById("editMode").checked; }
function setIxHint(msg) { document.getElementById("ixHint").textContent = msg; }
function updateIxHint() {
  if (state.labelMode) { setIxHint("線をクリックして時間ラベルをON/OFF"); return; }
  if (editModeOn()) { setIxHint("編集するブロックをクリック（図 または 右のソース行）"); return; }
  if (!ixModeOn()) { setIxHint("ホイール=ズーム / ドラッグ=移動"); return; }
  setIxHint(state.ixFirst ? "2本目のG1線をクリック" : "1本目のG1線をクリック");
}
cv.addEventListener("click", e => {
  if (moved || !state.data) return; // ドラッグは無視
  const r0 = cv.getBoundingClientRect();
  // 加工時間ラベルの個別ON/OFF（専用モード or Alt+クリック）
  if (state.labelMode || (e.altKey && showTimeOn())) {
    const seg = hitTest(e.clientX - r0.left, e.clientY - r0.top);
    if (seg) { toggleTimeLabel(seg.line); return; }
    if (state.labelMode) { setIxHint("線が見つかりません（線の近くをクリック）"); return; }
  }
  if (editModeOn()) {
    const seg = hitTest(e.clientX - r0.left, e.clientY - r0.top);
    if (!seg) { setIxHint("ブロックが見つかりません（線の近くをクリック）"); return; }
    selectEditSeg(seg.line);
    return;
  }
  if (!ixModeOn()) return;
  const rect = r0;
  const seg = pickG1(e.clientX - rect.left, e.clientY - rect.top);
  if (!seg) { setIxHint("G1線が見つかりません（線の近くをクリック）"); return; }
  if (!state.ixFirst) {
    state.ixFirst = seg;
    updateIxHint();
  } else if (seg === state.ixFirst) {
    setIxHint("別のG1線を選んでください");
  } else {
    const ip = lineIntersect(state.ixFirst, seg);
    if (!ip) { setIxHint("平行な2線は交点なし"); state.ixFirst = null; }
    else {
      state.ixPoints.push({ aLine: state.ixFirst.line, bLine: seg.line });
      state.ixFirst = null;
      setIxHint(`交点: ⌀${fmt(ip.r * 2)} Z${fmt(ip.z)}`);
    }
  }
  draw();
});
window.addEventListener("keydown", e => {
  // 設定ダイアログが開いている間は、Escape も Ctrl+Z もそちらに任せる
  if (cfgDlg.open) return;
  if (e.key === "Escape") {
    // 測った交点は編集の足場になるので、まず編集選択だけを解除する。
    // 解除するものが無ければ交点をクリア（全消しは「交点クリア」ボタン）。
    if (state.editLine != null || state.ixFirst) {
      state.ixFirst = null;
      clearEditSel();
    } else {
      state.ixPoints = [];
    }
    updateIxHint(); draw();
    return;
  }
  // Ctrl+Z で編集を1段戻す（入力欄にフォーカスがあるときは既定動作を優先）
  const tag = (e.target && e.target.tagName || "").toUpperCase();
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "z" && tag !== "INPUT" && tag !== "TEXTAREA") {
    if (undoStack.length) { e.preventDefault(); undoEdit(); }
  }
});

// ホイールズーム（カーソル中心）
cv.addEventListener("wheel", e => {
  e.preventDefault();
  const rect = cv.getBoundingClientRect();
  const px = e.clientX - rect.left, py = e.clientY - rect.top;
  const worldZ = sxToZ(px), worldR = syToR(py);
  const factor = e.deltaY < 0 ? 1.15 : 1/1.15;
  state.scale *= factor;
  // カーソル位置のワールド点を固定
  state.offsetX = px - worldZ * state.scale;
  state.offsetY = py + worldR * state.scale;
  draw();
}, { passive: false });

// ===== ソース一覧 =====
function renderSrc() {
  const el = document.getElementById("src");
  el.innerHTML = "";
  const lines = state.data.rawLines;
  for (let i = 0; i < lines.length; i++) {
    const div = document.createElement("div");
    div.className = "ln" + (state.editLine === i + 1 ? " sel" : "");
    div.dataset.line = i + 1;
    div.innerHTML = `<span class="num">${i+1}</span><span class="code"></span>`;
    div.querySelector(".code").textContent = lines[i];
    div.addEventListener("mouseenter", () => {
      const ln = i + 1;
      const seg = state.data.segs.find(s => s.line === ln);
      state.hoverSeg = seg || null;
      draw();
    });
    div.addEventListener("mouseleave", () => { state.hoverSeg = null; draw(); });
    // クリックで座標アシストの対象に選択（モード不問）
    div.addEventListener("click", () => selectEditSeg(i + 1));
    el.appendChild(div);
  }
}
function highlightSrc(lineNo) {
  const el = document.getElementById("src");
  const prev = el.querySelector(".ln.hl");
  if (prev) prev.classList.remove("hl");
  if (lineNo != null) {
    const t = el.querySelector(`.ln[data-line="${lineNo}"]`);
    if (t) { t.classList.add("hl"); t.scrollIntoView({ block: "nearest" }); }
  }
}

// ===== 凡例 =====
function renderLegend() {
  const el = document.getElementById("legend");
  let html = `<div class="row"><span class="swatch dash"></span>G0 早送り</div>`;
  html += `<div class="row"><span class="swatch" style="background:#666;height:2px"></span>G1/G2/G3 切削（色=工具）</div>`;
  html += `<div class="row" style="color:var(--muted);font-size:11px;margin-top:6px">工具ごとの原位置（空欄=指定なし）</div>`;
  for (const t of state.data.tools) {
    const o = origins[t] || {};
    const xv = isFinite(o.x) ? o.x : "";
    const zv = isFinite(o.z) ? o.z : "";
    html += `<div class="row orow"><span class="swatch" style="background:${toolColor(t)}"></span>T${t}` +
      `<span class="oin">⌀<input type="number" step="any" data-otool="${t}" data-axis="x" value="${xv}" placeholder="X直径"></span>` +
      `<span class="oin">Z<input type="number" step="any" data-otool="${t}" data-axis="z" value="${zv}" placeholder="Z"></span></div>`;
  }
  el.innerHTML = html;
  el.querySelectorAll("input[data-otool]").forEach(inp => {
    inp.addEventListener("change", onOriginChange);
  });
}

function onOriginChange(e) {
  const t = parseInt(e.target.dataset.otool, 10);
  const axis = e.target.dataset.axis;
  const v = e.target.value.trim();
  if (!origins[t]) origins[t] = {};
  origins[t][axis] = v === "" ? NaN : parseFloat(v);
  // 両軸が揃っていなければ原位置は無効
  reparse();
  draw();
}

// ===== 座標アシスト =====
// 選択は行番号で保持する（reparse で segs が作り直されるため参照は持てない）
function editSeg() {
  if (!state.data || state.editLine == null) return null;
  return state.data.segs.find(s => s.line === state.editLine) || null;
}
// 選択セグメントの直前／直後のセグメント（動く端点が乗る線＝線N の供給元）
function prevSegOf(seg) {
  const i = state.data.segs.indexOf(seg);
  return i > 0 ? state.data.segs[i - 1] : null;
}
function nextSegOf(seg) {
  const i = state.data.segs.indexOf(seg);
  return i >= 0 && i < state.data.segs.length - 1 ? state.data.segs[i + 1] : null;
}

// 選択セグメントが当事者になっている理論交点を列挙する。
// partner = 相手線（固定して交点を滑らせる線 P）
function ixOnSeg(seg) {
  const out = [];
  if (!seg || seg.type !== 1) return out;
  state.ixPoints.forEach((p, idx) => {
    if (p.aLine !== seg.line && p.bLine !== seg.line) return;
    const ip = ixResolve(p);
    if (!ip) return;
    out.push({ idx, partner: p.aLine === seg.line ? ip.b : ip.a, z: ip.z, r: ip.r });
  });
  return out;
}

// 保留中の線Aから、この線に乗っている交点を解き直す。
// 自動対象の交点は solveByIntersection が相手線上に置いた値なので上書きしない。
function refreshIx(ed) {
  if (!ed || !ed.ixList || !ed.ixList.length) return;
  const active = parseIxField(ed.auto);
  const lineA = { x0: ed.x0, z0: ed.z0, x1: ed.x1, z1: ed.z1 };
  ed.ixList.forEach((e, i) => {
    if (active && active.i === i) return;
    const ip = lineIntersect(lineA, e.partner);
    if (ip) { e.z = ip.z; e.r = ip.r; }
  });
}

// 交点フィールド名 "ipx:<n>" / "ipz:<n>" （n = ed.ixList 内の位置）
function ixField(kind, i) { return kind + ":" + i; }
function parseIxField(f) {
  const m = /^(ipx|ipz):(\d+)$/.exec(f || "");
  return m ? { kind: m[1], i: +m[2] } : null;
}

// 交点を動かせるか。動かせないなら理由の文言を返す（動かせるなら null）
function ixBlockReason(ed, entry) {
  if (!ed || !entry) return "交点がありません。";
  if (ed.followX || ed.followZ)
    return `この行は${ed.followX && ed.followZ ? "⌀X・Z両方" : (ed.followX ? "⌀X" : "Z")}を省略/増分指定しているため交点を動かせません。「固定」で解除してください。`;
  const anchorEnd = ed.ixAnchor !== "start";
  if (anchorEnd && !ed.startEditable) return "アンカー=終点では始点が動く必要がありますが、この始点は編集できません。";
  const n = anchorEnd ? ed.prevSeg : ed.nextSeg;
  if (!n) return `動く${anchorEnd ? "始点" : "終点"}が乗る${anchorEnd ? "前" : "次"}ブロックがありません。`;
  if (isArcSeg(n)) return `${anchorEnd ? "前" : "次"}ブロック(行${n.line})が円弧のため直線の交点として解けません。`;
  if (n === entry.partner) return `${anchorEnd ? "前" : "次"}ブロックが相手線(行${entry.partner.line})と同じため退化します。`;
  return null;
}

// 自動対象にできる値。追従中の軸は始点・終点とも対象外
//（X が追従なら x1 = x0 + 一定 なので、角度式は X 方向の自由度を持たない）
function autoCandidates(ed) {
  if (!ed) return [];
  const list = [];
  if (!ed.followX) list.push("x0", "x1");
  if (!ed.followZ) list.push("z0", "z1");
  if (list.length) list.push("ang");
  (ed.ixList || []).forEach((e, i) => {
    if (ixBlockReason(ed, e)) return;
    list.push(ixField("ipx", i), ixField("ipz", i));
  });
  return list;
}

// 自動計算される点＝動かす点。もう一方の点は基準（アンカー）として触らせない。
// 自動が角度のときは「自動になる点」が無いので、両端とも編集できる。
function movingPoint(ed) {          // → "start" | "end" | "ix" | null
  if (!ed || !ed.auto) return null;
  if (ed.auto === "x0" || ed.auto === "z0") return "start";
  if (ed.auto === "x1" || ed.auto === "z1") return "end";
  if (parseIxField(ed.auto)) return "ix";
  return null;
}
// 基準＝アンカー側の端点（動かさない点）
function isAnchorField(ed, field) {
  const mp = movingPoint(ed);
  if (!mp) return false;
  if (mp === "ix") {
    return ed.ixAnchor === "start" ? (field === "x0" || field === "z0")
                                   : (field === "x1" || field === "z1");
  }
  return mp === "start" ? (field === "x1" || field === "z1")
                        : (field === "x0" || field === "z0");
}
// 連動＝交点から導出されて読み取り専用になる欄（動く端点と角度）
function isDerivedField(ed, field) {
  if (movingPoint(ed) !== "ix") return false;
  if (field === "ang") return true;
  return ed.ixAnchor === "start" ? (field === "x1" || field === "z1")
                                 : (field === "x0" || field === "z0");
}

function selectEditSeg(lineNo) {
  const seg = state.data ? state.data.segs.find(s => s.line === lineNo) : null;
  if (!seg) {
    state.editLine = null; state.edit = null;
    renderAssist("この行には移動指令がありません。");
    markSelectedSrc(); draw();
    return;
  }
  state.editLine = lineNo;
  const raw = state.data.rawLines[seg.line - 1];
  const prev = prevSegOf(seg);
  // 始点を編集できるのは、直前セグメントの終点と一致する＝共有頂点のときだけ
  const startEditable = !!prev &&
    Math.abs(prev.x1 - seg.x0) < 1e-9 && Math.abs(prev.z1 - seg.z0) < 1e-9;
  let startReason = null;
  if (!startEditable) {
    const o = origins[seg.tool];
    if (o && isFinite(o.x) && isFinite(o.z) &&
        Math.abs(o.x - seg.x0) < 1e-9 && Math.abs(o.z - seg.z0) < 1e-9) {
      startReason = `※ 始点は工具T${seg.tool}の原位置です。凡例の入力欄で変更してください。`;
    } else {
      startReason = "※ 始点は前ブロックの終点ではないため編集できません（プログラム先頭／G28・G50後の位置決めで決まります）。";
    }
  }
  state.edit = {
    x0: seg.x0, z0: seg.z0, x1: seg.x1, z1: seg.z1,
    ang: signedTaperAngle(seg),
    r: seg.r,
    auto: isArcSeg(seg) ? null : "z1",
    startEditable,
    startReason,
    prevLine: prev ? prev.line : null,
    prevSeg: prev,
    nextSeg: nextSegOf(seg),
    // この線に乗っている理論交点（交点測定で作ったもの）
    ixList: ixOnSeg(seg),
    ixAnchor: "end",     // 交点を動かすときの不動側。"end" | "start"
    // 終点がその軸で始点に追従するか（増分/省略）。「固定」ボタンで解除できる
    followX: axisFollows(raw, "X", "U"),
    followZ: axisFollows(raw, "Z", "W"),
    err: null,
  };
  if (state.edit.ang == null) state.edit.ang = 0;
  // 追従軸は自動対象にできないので、既定の "z1" が不可なら候補の先頭に落とす
  if (state.edit.auto && !autoCandidates(state.edit).includes(state.edit.auto)) {
    state.edit.auto = autoCandidates(state.edit)[0] || null;
  }
  renderAssist();
  markSelectedSrc();
  updateIxHint();
  draw();
}

function clearEditSel() {
  state.editLine = null; state.edit = null;
  renderAssist(); markSelectedSrc();
}

// #src の選択行ハイライトを付け替える（renderSrc の再構築なしで済ませる）
function markSelectedSrc() {
  const el = document.getElementById("src");
  const prev = el.querySelector(".ln.sel");
  if (prev) prev.classList.remove("sel");
  if (state.editLine != null) {
    const t = el.querySelector(`.ln[data-line="${state.editLine}"]`);
    if (t) { t.classList.add("sel"); t.scrollIntoView({ block: "nearest" }); }
  }
}

// 括弧内に代替寸法（X/Z/U/W/R 語）が入っているか
function hasAltDims(line) {
  return splitCodeParts(line).some(p => p.isComment && /[XZUWRxzuwr]\s*[+-]?[0-9]/.test(p.text));
}
// 行が軸をどう指定しているか（コード部のみ判定。括弧内の代替値は見ない）
//   "abs"  絶対語(X/Z)あり  → 終点は行の値で固定。始点が動いても終点は動かない
//   "inc"  増分語(U/W)あり  → 終点 = 始点 + 増分 → 始点に追従する
//   "none" どちらも無し     → 終点 = 始点（モーダル継承） → 始点に追従する
function axisMode(line, absL, incL) {
  const code = splitCodeParts(line).filter(p => !p.isComment);
  const has = L => code.some(p => new RegExp(L + "\\s*[+-]?[0-9]*\\.?[0-9]+", "i").test(p.text));
  if (has(absL)) return "abs";
  if (has(incL)) return "inc";
  return "none";
}
// 終点がその軸で始点に追従するか（増分・省略のとき）
function axisFollows(line, absL, incL) { return axisMode(line, absL, incL) !== "abs"; }

let assistEls = {};

function renderAssist(msg) {
  const el = document.getElementById("assist");
  const seg = editSeg();
  assistEls = {};
  if (!seg) {
    el.className = "assist";
    el.innerHTML = `<div class="ahead">座標アシスト</div>` +
      `<div class="note">${msg || "図の線 または 右のソース行をクリックして編集するブロックを選びます。"}</div>` +
      (undoStack.length ? `<div class="btns"><button id="aUndo">戻す</button></div>` : "");
    const u = document.getElementById("aUndo");
    if (u) u.addEventListener("click", undoEdit);
    return;
  }

  const ed = state.edit;
  const arc = isArcSeg(seg);
  const raw = state.data.rawLines[seg.line - 1];
  const cands = arc ? [] : autoCandidates(ed);
  // opts: { readonly, follow:"x1"|"z1"（追従中＝固定ボタンを出す）, anchor, derived, unit }
  const row = (lab, field, val, opts) => {
    const o = opts || {};
    const isAuto = ed.auto === field;
    const ro = isAuto || o.readonly || o.anchor || o.derived;
    // 追従軸はプログラムの構造上どうしても動くので「基準」より「追従」を優先して見せる
    const tag = o.follow ? `<span class="tag">追従</span><button class="pin" data-pin="${o.follow}" title="この軸を固定して編集できるようにする">固定</button>`
              : o.anchor ? `<span class="tag">基準</span>`
              : o.derived ? `<span class="tag">連動</span>` : "";
    return `<div class="arow"><span class="lab">${lab}</span>` +
      `<input type="number" step="any" data-af="${field}" value="${val}"${ro ? " readonly" : ""}>` +
      (o.unit || "") + tag +
      (cands.includes(field) ? `<label class="auto"><input type="radio" name="autoField" value="${field}"${isAuto ? " checked" : ""}> 自動</label>` : "") +
      `</div>`;
  };
  const marks = f => ({ anchor: isAnchorField(ed, f), derived: isDerivedField(ed, f) });
  const IXN = ["①", "②", "③", "④", "⑤", "⑥", "⑦", "⑧", "⑨"];

  let html = `<div class="ahead"><span class="g">${G_NAME[seg.type] || "G" + seg.type}</span> 行${seg.line} T${seg.tool}</div>`;
  if (!arc) {
    const mp = movingPoint(ed);
    const ixi = parseIxField(ed.auto);
    html += `<div class="note">${
        mp === "ix" ? `動かす点: <b>交点${IXN[ixi.i] || ""}</b>（${ed.ixAnchor === "start" ? "始点" : "終点"}は基準・${ed.ixAnchor === "start" ? "終点" : "始点"}と角度は連動）`
      : mp === "start" ? "動かす点: <b>始点</b>（終点は基準）"
      : mp === "end" ? "動かす点: <b>終点</b>（始点は基準）"
      : "両端を入力して角度を求めます"}</div>`;
  }
  if (ed.startEditable) {
    html += row("始点⌀X", "x0", fmt(ed.x0), marks("x0"));
    html += row("始点Z", "z0", fmt(ed.z0), marks("z0"));
  } else {
    html += `<div class="arow"><span class="lab">始点</span><span class="fixed">⌀${fmt(seg.x0)} Z${fmt(seg.z0)}</span></div>`;
    html += `<div class="note">${ed.startReason}</div>`;
  }
  html += row("終点⌀X", "x1", fmt(ed.x1), Object.assign(marks("x1"), { readonly: ed.followX, follow: ed.followX ? "x1" : null }));
  html += row("終点Z", "z1", fmt(ed.z1), Object.assign(marks("z1"), { readonly: ed.followZ, follow: ed.followZ ? "z1" : null }));
  if (arc) {
    html += `<div class="arow"><span class="lab">R</span><input type="number" step="any" data-af="r" value="${ed.r != null ? fmt(ed.r) : ""}"></div>`;
    html += `<div class="note">円弧は角度拘束の対象外です（始点・終点・R の直接編集）。</div>`;
  } else {
    html += row("角度", "ang", ed.ang.toFixed(3), Object.assign(marks("ang"), { unit: `<span class="fixed">°</span>` }));
    html += `<div class="note">角度は半径基準・水平(Z軸)から。+ = Z+方向へ半径拡大 / 0°=外径 / ±90°=端面。</div>`;
  }
