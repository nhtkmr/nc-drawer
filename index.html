  // 理論交点（交点測定で作ったもののうち、この線に乗っているもの）
  // 入力できるのは「自動にした交点の、自動でない方の軸」だけ。他は線の動きに連動する表示。
  const activeIx = parseIxField(ed.auto);
  for (let i = 0; i < ed.ixList.length; i++) {
    const e = ed.ixList[i], n = IXN[i] || "";
    const blocked = ixBlockReason(ed, e);
    const isActive = !!activeIx && activeIx.i === i;
    const o = { readonly: !!blocked || !isActive, derived: !isActive && !blocked };
    html += `<div class="note" style="margin-top:6px">交点${n}　相手線: 行${e.partner.line}</div>`;
    html += row(`交点${n}⌀X`, ixField("ipx", i), fmt(e.r * 2), o);
    html += row(`交点${n}Z`, ixField("ipz", i), fmt(e.z), o);
    if (blocked) html += `<div class="note">※ ${blocked}</div>`;
  }
  if (movingPoint(ed) === "ix") {
    html += `<div class="arow"><span class="lab">アンカー</span>` +
      `<label class="auto"><input type="radio" name="ixAnchor" value="end"${ed.ixAnchor !== "start" ? " checked" : ""}> 終点</label>` +
      `<label class="auto"><input type="radio" name="ixAnchor" value="start"${ed.ixAnchor === "start" ? " checked" : ""}> 始点</label></div>`;
    html += `<div class="note">交点は相手線上を滑り、${ed.ixAnchor === "start" ? "終点は次" : "始点は前"}ブロックの線上を動きます（隣ブロックの向きは保たれます）。</div>`;
  }
  html += `<div class="err" id="aErr"></div>`;
  if (ed.followX || ed.followZ)
    html += `<div class="note">※ この行は${ed.followX && ed.followZ ? "⌀X・Z両方" : (ed.followX ? "⌀X" : "Z")}を省略/増分指定しているため、終点は始点に追従します。「固定」で語を新設して固定できます。</div>`;
  if (hasAltDims(raw)) html += `<div class="note">※ この行の括弧内の代替値は自動更新されません。</div>`;
  if (ed.startEditable) {
    html += `<div class="note">※ 始点の変更は前ブロック(行${ed.prevLine})を書き換えます。`;
    if (hasAltDims(state.data.rawLines[ed.prevLine - 1])) html += `前ブロックの括弧内代替値も自動更新されません。`;
    html += `</div>`;
  }
  // 次ブロックが軸を省略/増分指定していると、終点変更が後続にも波及する
  const next = state.data.segs[state.data.segs.indexOf(seg) + 1];
  if (next) {
    const nraw = state.data.rawLines[next.line - 1];
    const fx = axisFollows(nraw, "X", "U"), fz = axisFollows(nraw, "Z", "W");
    if (fx || fz)
      html += `<div class="note">※ 次のブロック(行${next.line})が${fx && fz ? "⌀X・Z両方" : (fx ? "⌀X" : "Z")}を省略/増分指定しているため、終点変更は後続にも波及します。</div>`;
  }
  html += `<div class="btns"><button class="pri" id="aApply">適用</button>` +
    `<button id="aUndo"${undoStack.length ? "" : " disabled"}>戻す</button>` +
    `<button id="aClear">選択解除</button></div>`;

  el.className = "assist on";
  el.innerHTML = html;

  assistEls.err = document.getElementById("aErr");
  assistEls.apply = document.getElementById("aApply");
  assistEls.inputs = {};
  el.querySelectorAll("input[data-af]").forEach(inp => {
    assistEls.inputs[inp.dataset.af] = inp;
    inp.addEventListener("input", onAssistInput);
  });
  el.querySelectorAll("input[name=autoField]").forEach(rb => {
    rb.addEventListener("change", () => {
      const wasIx = movingPoint(state.edit) === "ix";
      state.edit.auto = rb.value;
      // 交点モードへ出入りするときは端点を実際の座標に戻す（前モードの派生値を持ち越さない）
      if (wasIx !== (movingPoint(state.edit) === "ix")) resetEditValues(state.edit, editSeg());
      solveAuto(state.edit);   // 切替時に自動側を解き直す
      refreshIx(state.edit);
      renderAssist(); draw();
    });
  });
  // 「固定」＝その軸の追従を解除し、終点を明示値として編集できるようにする
  el.querySelectorAll("button[data-pin]").forEach(btn => {
    btn.addEventListener("click", () => {
      if (btn.dataset.pin === "x1") state.edit.followX = false;
      else state.edit.followZ = false;
      renderAssist(); draw();
    });
  });
  // 交点モードのアンカー切替
  el.querySelectorAll("input[name=ixAnchor]").forEach(rb => {
    rb.addEventListener("change", () => {
      state.edit.ixAnchor = rb.value;
      resetEditValues(state.edit, editSeg());   // 端点を実際の座標に戻してから解き直す
      solveAuto(state.edit); refreshIx(state.edit);
      renderAssist(); draw();
    });
  });
  document.getElementById("aApply").addEventListener("click", applyEdit);
  document.getElementById("aUndo").addEventListener("click", undoEdit);
  document.getElementById("aClear").addEventListener("click", () => { clearEditSel(); draw(); });
  syncAssistOutputs();
}

// 端点・角度を実際のセグメントの値に戻す（モード切替時に派生値を持ち越さないため）
function resetEditValues(ed, seg) {
  if (!ed || !seg) return;
  ed.x0 = seg.x0; ed.z0 = seg.z0; ed.x1 = seg.x1; ed.z1 = seg.z1;
  const a = signedTaperAngle(seg);
  ed.ang = a == null ? 0 : a;
  ed.err = null;
}

function onAssistInput(e) {
  const seg = editSeg();
  if (!seg || !state.edit) return;
  const ed = state.edit;
  const f = e.target.dataset.af;
  if (isAnchorField(ed, f) || isDerivedField(ed, f)) return;  // 基準・連動欄は動かさない
  const v = parseFloat(e.target.value);
  if (!isFinite(v)) return;              // 入力途中（"-" や空欄）は無視
  const ix = parseIxField(f);
  if (ix) {
    // 交点欄への入力。自動になっていない交点は読み取り専用なので無視する
    const active = parseIxField(ed.auto);
    if (!active || active.i !== ix.i) return;
    const entry = ed.ixList[ix.i];
    if (ix.kind === "ipx") entry.r = v / 2; else entry.z = v;
  } else {
    // 始点を動かしたとき、その軸が追従なら終点も同じだけずらす（軸ごとに独立）
    if (f === "x0" && ed.followX) ed.x1 += v - ed.x0;
    if (f === "z0" && ed.followZ) ed.z1 += v - ed.z0;
    ed[f] = v;
  }
  if (!isArcSeg(seg)) solveAuto(ed);
  refreshIx(ed);
  syncAssistOutputs();
  draw();
}

// 自動欄・エラー・ボタンだけを更新する（フォーカスを失わないためパネルは作り直さない）
function syncAssistOutputs() {
  const seg = editSeg();
  if (!seg || !state.edit || !assistEls.err) return;
  const ed = state.edit;
  const put = (f) => {
    const inp = assistEls.inputs[f];
    if (!inp) return;
    const ix = parseIxField(f);
    if (ix) { const e = ed.ixList[ix.i]; inp.value = fmt(ix.kind === "ipx" ? e.r * 2 : e.z); return; }
    inp.value = f === "ang" ? ed.ang.toFixed(3) : fmt(ed[f]);
  };
  if (ed.auto) put(ed.auto);
  // 追従中の終点欄は始点入力に連動するので毎回書き戻す
  if (ed.followX) put("x1");
  if (ed.followZ) put("z1");
  // 交点モードでは端点と角度が交点から導出されるので書き戻す
  if (movingPoint(ed) === "ix") {
    put("ang");
    if (ed.ixAnchor === "start") { put("x1"); put("z1"); } else { put("x0"); put("z0"); }
  }
  // 交点欄は線の動きに連動するので毎回書き戻す（入力中の欄は上書きしない）
  ed.ixList.forEach((_, i) => {
    const a = parseIxField(ed.auto);
    const skip = a && a.i === i ? (a.kind === "ipx" ? "ipz" : "ipx") : null;
    if (skip !== "ipx") put(ixField("ipx", i));
    if (skip !== "ipz") put(ixField("ipz", i));
  });
  assistEls.err.textContent = ed.err || "";
  const NE = (a, b) => Math.abs(a - b) > 1e-9;
  const changed = NE(ed.x0, seg.x0) || NE(ed.z0, seg.z0) || NE(ed.x1, seg.x1) || NE(ed.z1, seg.z1) ||
    (isArcSeg(seg) && seg.r != null && isFinite(ed.r) && NE(ed.r, seg.r));
  assistEls.apply.disabled = !!ed.err || !changed;
}

// ===== 適用 / 元に戻す / 保存 =====
function applyEdit() {
  const seg = editSeg();
  const ed = state.edit;
  if (!seg || !ed || ed.err) return;
  const lines = lastText.split(/\r?\n/);
  let touched = false;

  // 始点＝前ブロックの終点。共有頂点が動くなら前ブロックの行を書き換える
  const prev = prevSegOf(seg);
  if (ed.startEditable && prev &&
      (Math.abs(ed.x0 - prev.x1) > 1e-9 || Math.abs(ed.z0 - prev.z1) > 1e-9)) {
    const sl = buildStartLine(prev, ed);
    if (lines[prev.line - 1] !== sl) { lines[prev.line - 1] = sl; touched = true; }
  }
  const el = buildEndLine(seg, ed);
  if (lines[seg.line - 1] !== el) { lines[seg.line - 1] = el; touched = true; }
  if (!touched) return;

  undoStack.push(lastText);
  lastText = lines.join(eol);
  syncDirty();
  reparse();
  draw();
}

function undoEdit() {
  if (!undoStack.length) return;
  lastText = undoStack.pop();
  syncDirty();
  reparse();
  draw();
}

function syncDirty() {
  dirty = lastText !== savedText;
  updateFileNameLabel();
}

// reparse 後、同じ行を選び直して編集値を実際の座標に同期する
function reselectAfterReparse() {
  if (state.editLine == null) { renderAssist(); markSelectedSrc(); return; }
  const auto = state.edit ? state.edit.auto : null;
  const ixAnchor = state.edit ? state.edit.ixAnchor : "end";
  selectEditSeg(state.editLine);
  if (!state.edit) return;
  state.edit.ixAnchor = ixAnchor;
  // 自動対象は引き継ぐ。再パースで候補から外れた場合は selectEditSeg が入れた既定のまま
  if (auto && autoCandidates(state.edit).includes(auto)) {
    state.edit.auto = auto;
    renderAssist();
  }
}

function updateFileNameLabel() {
  document.getElementById("fileName").textContent = state.fileName + (dirty ? " *" : "");
}

function saveFile() {
  if (!state.data) return;
  const blob = new Blob([lastText], { type: "text/plain" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = state.fileName || "program.nc";
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(a.href);
  savedText = lastText;
  syncDirty();
}

// ===== ロード =====
let lastText = "";
function load(text, name) {
  lastText = text;
  savedText = text;
  eol = text.includes("\r\n") ? "\r\n" : "\n";  // 元の改行コードを保つ
  undoStack = [];
  origins = {};                 // 新規ファイルでは原位置をクリア
  state.data = parseNc(text, origins, tcfg(), flipOn());
  state.fileName = name;
  state.playhead = 1; state.playing = false;
  state.ixFirst = null; state.ixPoints = [];  // 交点測定をクリア
  state.editLine = null; state.edit = null;   // 座標アシストをクリア
  state.timeHidden.clear();                   // 時間ラベルの個別指定をクリア
  syncDirty();
  document.getElementById("segCount").textContent = state.data.segs.length + " seg";
  renderSrc();
  renderLegend();
  renderAssist();
  renderTimePanel();
  fitView();
  syncTransport();
  draw();
  document.getElementById("emptyHint").style.display = "none";
}

// 原位置変更などでビューを保持したまま再パース
function reparse() {
  state.data = parseNc(lastText, origins, tcfg(), flipOn());
  document.getElementById("segCount").textContent = state.data.segs.length + " seg";
  renderSrc();
  reselectAfterReparse();   // 座標アシストの選択・編集値を新しいセグメントに同期
  renderTimePanel();
  syncTransport();
}

// ===== 再生 =====
let lastHlLine = null;
function setPlayhead(p, seekPause) {
  if (!state.data) return;
  state.playhead = Math.max(0, Math.min(1, p));
  if (seekPause) state.playing = false;
  syncTransport();
  const pl = playAt(state.playhead);
  const ln = state.playhead >= 1 ? null
    : (pl.waiting ? pl.waiting.line : (pl.idx >= 0 ? state.data.segs[pl.idx].line : null));
  if (ln !== lastHlLine) { highlightSrc(ln); lastHlLine = ln; }
  draw();
}

function syncTransport() {
  if (!state.data) return;
  const seek = document.getElementById("seek");
  seek.value = Math.round(state.playhead * 1000);
  document.getElementById("btnPlay").textContent = state.playing ? "⏸" : "▶";
  const info = document.getElementById("playInfo");
  const d = state.data;
  const el = fmtSec(state.playhead * d.totalT);
  if (state.playhead >= 1 && !state.playing) {
    info.textContent = `全表示  ${fmtSec(d.totalT)}`;
  } else {
    const pl = playAt(state.playhead);
    if (pl.waiting) info.textContent = `${el} / ${fmtSec(d.totalT)}  ${pl.waiting.label} ${fmtSec(pl.waiting.sec)}`;
    else {
      const s = d.segs[pl.idx];
      info.textContent = s ? `${el} / ${fmtSec(d.totalT)}  行${s.line}` : el;
    }
  }
}

let rafId = null, lastTs = 0;
function tick(ts) {
  if (!state.playing || !state.data) { rafId = null; return; }
  if (!lastTs) lastTs = ts;
  const dt = (ts - lastTs) / 1000; lastTs = ts;
  // totalT は実秒なので、速度1.0 = 実機と同じ速さで進む
  state.playhead += dt * state.speed / state.data.totalT;
  if (state.playhead >= 1) {
    state.playhead = 1; state.playing = false;
    syncTransport(); draw(); rafId = null; return;
  }
  setPlayhead(state.playhead, false);
  rafId = requestAnimationFrame(tick);
}
function play() {
  if (!state.data || !state.data.segs.length) return;
  if (state.playhead >= 1) state.playhead = 0; // 末尾なら先頭から
  state.playing = true; lastTs = 0;
  syncTransport();
  if (!rafId) rafId = requestAnimationFrame(tick);
}
function pause() { state.playing = false; syncTransport(); }
function stepSeg(dir) {
  const d = state.data;
  if (!d || !d.segs.length) return;
  const pl = playAt(state.playhead >= 1 ? 1 : state.playhead);
  let idx = pl.idx + (dir > 0 ? 1 : ((pl.t > 0.001 || pl.waiting) ? 0 : -1));
  if (dir > 0 && idx > d.segs.length - 1) { setPlayhead(1, true); return; }
  idx = Math.max(0, Math.min(d.segs.length - 1, idx));
  // セグメント idx の終端(dir>0) or 始端 に合わせる（待ちステップは跨いで進む）
  const si = d.segStepIdx[idx];
  const target = dir > 0 ? d.cumT[si + 1] : d.cumT[si];
  setPlayhead(target / d.totalT, true);
}

const CAT_LABEL = {
  cut: "切削 G1", arc: "円弧 G2/G3", rapid: "早送り G0",
  dwell: "ドウェル G4", tool: "工具交換", aux: "主軸・停止・M",
};
function showTimeOn() { return document.getElementById("showTime").checked; }

// ツールチップに出す長さ・送り・時間。旋盤は「送り＝F×回転数」なので回転数も見せる
function timeTip(s) {
  const c = tcfg();
  let h = `<br>長さ ${fmt(s.len)} ・ <b>${fmtSec(s.sec)}</b>`;
  if (s.type === 0) return h + `（早送り X${c.rapidX} / Z${c.rapidZ} m/min）`;
  const F = s.feed > 0 ? s.feed : c.defaultFeed;
  if (s.feedMode === 98) return h + `<br>F${fmt(F)} mm/min` + (s.est ? " ⚠F既定" : "");
  const r0 = Math.round(s.rpm0), r1 = Math.round(s.rpm1);
  const rpm = r0 === r1 ? `${r0}` : `${r0}→${r1}`;
  h += `<br>F${fmt(F)} mm/rev × ${rpm}rpm ≒ ${Math.round(s.feedMMPM)} mm/min`;
  const smax = s.sMax > 0 ? s.sMax : c.spindleMax;
  if (s.cssMode === 96) {
    h += `<br>G96 S${fmt(s.sVal || c.defaultCss)} m/min`;
    if (Math.max(r0, r1) >= smax - 0.5) h += `（S${smax}でクランプ）`;
  } else {
    h += `<br>G97 ${Math.round(rpmAt(0, s, c))} rpm`;
  }
  if (s.est) h += " ⚠F既定";
  return h;
}

function renderTimePanel() {
  const el = document.getElementById("timePanel");
  const on = showTimeOn();
  el.classList.toggle("on", on);
  if (!on || !state.data) { el.innerHTML = ""; return; }
  const d = state.data, c = tcfg();
  let sel = 0, all = 0;
  for (const k in d.sum) { all += d.sum[k]; if (state.timeCats[k]) sel += d.sum[k]; }

  let html = `<div class="thead"><span class="tot">${fmtSec(sel)}</span>` +
    `<span class="lab">サイクルタイム</span></div>`;
  for (const k of ["cut", "arc", "rapid", "dwell", "tool", "aux"]) {
    if (!d.cnt[k]) continue;
    html += `<div class="trow"><label class="nm"><input type="checkbox" data-cat="${k}"` +
      `${state.timeCats[k] ? " checked" : ""}>${CAT_LABEL[k]}<span class="cnt">×${d.cnt[k]}</span></label>` +
      `<span class="sec">${fmtSec(d.sum[k])}</span></div>`;
  }
  if (Math.abs(all - sel) > 1e-6)
    html += `<div class="trow sum"><span class="nm">合計（全種別）</span><span class="sec">${fmtSec(all)}</span></div>`;

  // 工具別（種別トグルを反映して数え直す）
  const byTool = {};
  const addT = (cat, tool, sec) => { if (tool >= 1 && state.timeCats[cat]) byTool[tool] = (byTool[tool] || 0) + sec; };
  for (const sg of d.segs) addT(sg.cat, sg.tool, sg.sec);
  for (const e of d.events) addT(e.cat, e.tool, e.sec);
  const tls = Object.keys(byTool).map(Number).sort((a, b) => a - b);
  if (tls.length) {
    html += `<div class="sub">工具別</div><div class="tools">` + tls.map(t =>
      `<span><i style="background:${toolColor(t)}"></i>T${t} ${fmtSec(byTool[t])}</span>`).join("") + `</div>`;
  }

  html += `<div class="btns"><label class="nm"><input type="checkbox" id="tLabelMode"` +
    `${state.labelMode ? " checked" : ""}>クリックでラベルを個別ON/OFF</label></div>`;
  if (state.timeHidden.size)
    html += `<div class="btns"><span class="cnt">個別に消したラベル ${state.timeHidden.size}行</span>` +
      `<button id="tShowAll">全部出す</button></div>`;

  const unset = d.mSeen.filter(m => !(String(m) in c.mTable));
  if (unset.length)
    html += `<div class="sub">時間未設定のMコード</div><div class="btns">` +
      `<span class="cnt">${unset.map(m => "M" + m).join(" ")}</span>` +
      `<button id="tAddM">Mコード表に登録</button></div>`;
  for (const w of d.warn) html += `<div class="warn">⚠ ${w}</div>`;
  html += `<div class="btns"><button id="tOpenCfg">⚙ 時間設定（${machines.presets[machines.active].name}）</button></div>`;
  el.innerHTML = html;

  el.querySelectorAll("input[data-cat]").forEach(inp => inp.addEventListener("change", e => {
    state.timeCats[e.target.dataset.cat] = e.target.checked;
    renderTimePanel(); draw();
  }));
  const lm = el.querySelector("#tLabelMode");
  if (lm) lm.addEventListener("change", e => setLabelMode(e.target.checked));
  const sa = el.querySelector("#tShowAll");
  if (sa) sa.addEventListener("click", () => { state.timeHidden.clear(); renderTimePanel(); draw(); });
  const am = el.querySelector("#tAddM");
  if (am) am.addEventListener("click", () => {
    for (const m of unset) c.mTable[m] = 0;
    saveMachines(); recalcTime(); openTimeCfg();
  });
  const oc = el.querySelector("#tOpenCfg");
  if (oc) oc.addEventListener("click", openTimeCfg);
}

    `<div class="cfg-row"><span class="lab">M1 オプショナルストップ</span>` +
    `<label class="unit" style="width:auto"><input type="checkbox" data-cfb="m1Enabled"${c.m1Enabled ? " checked" : ""}> 有効</label>` +
    `<input type="number" step="any" data-cf="m1Sec" value="${c.m1Sec}"><span class="unit">秒</span></div>` +
    cfgNum("最小ブロック時間", "minBlockSec", "秒") +
    `<div class="cfg-note">タレット段数を2以上、1段あたりを0より大きくすると、割出しの回り段数に比例した時間を上乗せします。</div>` +

    `<h4>Mコード別の待ち時間</h4>` +
    `<div class="mtab" id="mtab">` + mRows.map(m =>
      `<span class="mrow">M<input type="number" class="mc" step="1" value="${m}">` +
      `<input type="number" class="ms" step="any" value="${c.mTable[m]}">秒<button class="mdel">×</button></span>`).join("") +
    `</div><div class="cfg-row"><button id="mAdd">＋ 行を追加</button></div>` +
    `<div class="cfg-note">M0/M1/M3/M4/M5/M2/M30/M98/M99 は上の項目で扱うため、ここでは指定できません。</div>` +

    `<h4>補正係数</h4>` +
    cfgNum("切削 ×", "factorCut", "") + cfgNum("早送り ×", "factorRapid", "") +
    `<div class="cfg-note">加減速やサーボ遅れをまとめて吸収するための係数です。実測サイクルタイムに合うよう調整してください。</div>`;

  bindCfgInputs();
}

function bindCfgInputs() {
  const body = document.getElementById("cfgBody");
  body.querySelectorAll("[data-cf]").forEach(inp => inp.addEventListener("change", e => {
    const k = e.target.dataset.cf;
    const v = parseFloat(e.target.value);
    tcfg()[k] = isFinite(v) ? v : DEFAULT_CFG[k];
    if (!isFinite(v)) e.target.value = tcfg()[k];
    saveMachines(); recalcTime();
  }));
  body.querySelectorAll("[data-cfb]").forEach(inp => inp.addEventListener("change", e => {
    tcfg()[e.target.dataset.cfb] = e.target.checked;
    saveMachines(); recalcTime();
  }));
  body.querySelectorAll(".mtab .mrow input").forEach(inp => inp.addEventListener("change", syncMTable));
  body.querySelectorAll(".mtab .mdel").forEach(b => b.addEventListener("click", e => {
    e.target.closest(".mrow").remove(); syncMTable();
  }));
  const add = document.getElementById("mAdd");
  if (add) add.addEventListener("click", () => {
    const row = document.createElement("span");
    row.className = "mrow";
    row.innerHTML = `M<input type="number" class="mc" step="1" value=""><input type="number" class="ms" step="any" value="1">秒<button class="mdel">×</button>`;
    document.getElementById("mtab").appendChild(row);
    row.querySelectorAll("input").forEach(i => i.addEventListener("change", syncMTable));
    row.querySelector(".mdel").addEventListener("click", () => { row.remove(); syncMTable(); });
    row.querySelector(".mc").focus();
  });
}

// 表の行をそのまま読んで mTable を作り直す（行を消しても矛盾しない）
function syncMTable() {
  const t = {};
  document.querySelectorAll("#mtab .mrow").forEach(r => {
    const code = Math.abs(Math.round(parseFloat(r.querySelector(".mc").value)));
    const sec = parseFloat(r.querySelector(".ms").value);
    if (isFinite(code) && code > 0 && !M_HANDLED.has(code)) t[code] = isFinite(sec) ? sec : 0;
  });
  tcfg().mTable = t;
  saveMachines(); recalcTime();
}

// プログラムは変わっていないので、行一覧は作り直さず時間だけ計算し直す
function recalcTime() {
  if (!state.data) { renderTimePanel(); return; }
  state.data = parseNc(lastText, origins, tcfg(), flipOn());
  reselectAfterReparse();
  renderTimePanel();
  syncTransport();
  draw();
}

document.getElementById("timeCfgBtn").addEventListener("click", openTimeCfg);
document.getElementById("cfgClose").addEventListener("click", () => cfgDlg.close());
document.getElementById("cfgPreset").addEventListener("change", e => {
  machines.active = parseInt(e.target.value, 10) || 0;
  saveMachines(); renderTimeCfg(); recalcTime();
});
document.getElementById("cfgNew").addEventListener("click", () => {
  const base = machines.presets[machines.active];
  machines.presets.push({ name: base.name + " のコピー", cfg: JSON.parse(JSON.stringify(base.cfg)) });
  machines.active = machines.presets.length - 1;
  saveMachines(); renderTimeCfg(); recalcTime();
});
document.getElementById("cfgRename").addEventListener("click", () => {
  const cur = machines.presets[machines.active];
  const v = window.prompt("この機械設定の名前", cur.name);
  if (v == null) return;
  cur.name = v.trim() || cur.name;
  saveMachines(); renderTimeCfg(); renderTimePanel();
});
document.getElementById("cfgDel").addEventListener("click", () => {
  if (machines.presets.length <= 1) { machines.presets[0] = { name: "既定", cfg: Object.assign({}, DEFAULT_CFG) }; }
  else machines.presets.splice(machines.active, 1);
  machines.active = Math.min(machines.active, machines.presets.length - 1);
  saveMachines(); renderTimeCfg(); recalcTime();
});
document.getElementById("cfgReset").addEventListener("click", () => {
  machines.presets[machines.active].cfg = Object.assign({}, DEFAULT_CFG);
  saveMachines(); renderTimeCfg(); recalcTime();
});
document.getElementById("showTime").addEventListener("change", () => { renderTimePanel(); draw(); });

// 初期化（サンプルは埋め込まない：ファイルを読み込むまで空表示）
renderAssist();
renderTimePanel();
resizeCanvas();
</script>
</body>
</html>
